function boardBindEvents(body) {
  const canvas = body.querySelector('#board-canvas');
  const b = boardGetActive();
  body.querySelectorAll('[data-tool]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      boardActiveTool=btn.dataset.tool; boardUpdateToolbar();
      canvas.style.cursor=boardActiveTool==='select'?'grab':'crosshair';
    });
  });
  const switcherBtn=body.querySelector('#board-switcher-btn'), switcherMenu=body.querySelector('#board-switcher-menu');
  switcherBtn?.addEventListener('click',e=>{e.stopPropagation();switcherMenu.style.display=switcherMenu.style.display==='none'?'block':'none';});
  document.addEventListener('click',()=>{if(switcherMenu)switcherMenu.style.display='none';});
  body.querySelectorAll('[data-switch-board]').forEach(btn=>btn.addEventListener('click',()=>boardSwitch(btn.dataset.switchBoard)));
  body.querySelector('#board-new-btn')?.addEventListener('click',boardNew);
  const nameEl=body.querySelector('#board-name-display');
  nameEl?.addEventListener('dblclick',()=>{
    const inp=document.createElement('input');
    inp.value=b?.name||''; inp.style.cssText='font-size:13px;font-weight:600;background:rgba(255,255,255,0.08);border:1px solid var(--ndz-accent-glow);border-radius:7px;color:var(--t1);padding:3px 8px;outline:none;width:120px';
    nameEl.replaceWith(inp); inp.focus(); inp.select();
    const done=()=>{if(b){b.name=inp.value.trim()||b.name;saveBoard();}boardFullRender();};
    inp.addEventListener('blur',done); inp.addEventListener('keydown',e=>{if(e.key==='Enter')done();});
  });
  body.querySelector('#board-import-noir')?.addEventListener('click',()=>boardShowImportOverlay('noir'));
  body.querySelector('#board-import-flow')?.addEventListener('click',()=>boardShowImportOverlay('flow'));
  body.querySelector('#board-import-rift')?.addEventListener('click',()=>boardShowImportOverlay('rift'));
  body.querySelector('#board-zoom-in')?.addEventListener('click',()=>{boardState.zoom=Math.min(3,boardState.zoom*1.2);boardApplyTransform();boardUpdateZoomDisplay();boardSaveView();});
  body.querySelector('#board-zoom-out')?.addEventListener('click',()=>{boardState.zoom=Math.max(0.2,boardState.zoom*0.8);boardApplyTransform();boardUpdateZoomDisplay();boardSaveView();});
  body.querySelector('#board-fit')?.addEventListener('click',boardFitToScreen);
  body.querySelector('#board-export')?.addEventListener('click',boardExportPNG);
  body.querySelector('#board-clear')?.addEventListener('click',()=>{
    if(!confirm('Clear all nodes?')) return;
    if(b){b.nodes=[];saveBoard();boardRenderAllNodes();}
  });
  canvas.addEventListener('click',e=>{
    if(boardActiveTool==='select'||boardSpacePan) return;
    if(e.target.closest('.board-node')||e.target.id==='board-toolbar') return;
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left-boardState.panX)/boardState.zoom;
    const y=(e.clientY-rect.top-boardState.panY)/boardState.zoom;
    boardAddNode(boardActiveTool,x,y);
    boardActiveTool='select'; boardUpdateToolbar(); canvas.style.cursor='grab';
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    boardState.zoom=Math.min(3,Math.max(0.2,boardState.zoom*(e.deltaY>0?0.9:1.1)));
    boardApplyTransform(); boardUpdateZoomDisplay(); boardSaveView();
  },{passive:false});
  canvas.addEventListener('mousedown',e=>{
    if(e.button===1||(e.button===0&&boardSpacePan)){
      e.preventDefault();
      boardPanDrag={startMouseX:e.clientX,startMouseY:e.clientY,startPanX:boardState.panX,startPanY:boardState.panY};
      canvas.classList.add('grabbing');
    }
  });
  canvas.addEventListener('dragover',e=>e.preventDefault());
  canvas.addEventListener('drop',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left-boardState.panX)/boardState.zoom;
    const y=(e.clientY-rect.top-boardState.panY)/boardState.zoom;
    [...e.dataTransfer.files].forEach((file,i)=>{
      if(!file.type.startsWith('image/')) return;
      const reader=new FileReader();
      reader.onload=ev=>{
        boardAddSpecificNode({type:'image',x:x+i*20,y:y+i*20,w:300,h:220,data:{src:ev.target.result,objectFit:'cover',caption:'',borderRadius:10}});
        saveBoard(); boardRenderAllNodes(); boardUpdateEmptyState();
      };
      reader.readAsDataURL(file);
    });
  });
  document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('textarea')&&e.target.contentEditable!=='true'){e.preventDefault();boardSpacePan=true;canvas.style.cursor='grab';}});
  document.addEventListener('keyup',e=>{if(e.code==='Space'){boardSpacePan=false;canvas.style.cursor=boardActiveTool==='select'?'grab':'crosshair';}});
}

// Global drag/resize/pan handlers (added once at module level)
document.addEventListener('mousemove',e=>{
  if(boardDrag){
    const board=boardGetActive(); const n=board?.nodes.find(n=>n.id===boardDrag.nodeId); if(!n) return;
    n.x=boardDrag.startNodeX+(e.clientX-boardDrag.startMouseX)/boardState.zoom;
    n.y=boardDrag.startNodeY+(e.clientY-boardDrag.startMouseY)/boardState.zoom;
    const el=document.querySelector(`[data-node-id="${boardDrag.nodeId}"]`);
    if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';}
  }
  if(boardResizeDrag){
    const board=boardGetActive(); const n=board?.nodes.find(n=>n.id===boardResizeDrag.nodeId); if(!n) return;
    n.w=Math.max(80,boardResizeDrag.startW+(e.clientX-boardResizeDrag.startMouseX)/boardState.zoom);
    n.h=Math.max(60,boardResizeDrag.startH+(e.clientY-boardResizeDrag.startMouseY)/boardState.zoom);
    const el=document.querySelector(`[data-node-id="${boardResizeDrag.nodeId}"]`);
    if(el){el.style.width=n.w+'px';el.style.height=n.h+'px';}
  }
  if(boardPanDrag){
    boardState.panX=boardPanDrag.startPanX+(e.clientX-boardPanDrag.startMouseX);
    boardState.panY=boardPanDrag.startPanY+(e.clientY-boardPanDrag.startMouseY);
    boardApplyTransform();
  }
});
document.addEventListener('mouseup',()=>{
  if(boardDrag){saveBoard();boardDrag=null;}
  if(boardResizeDrag){saveBoard();boardResizeDrag=null;}
  if(boardPanDrag){
    boardSaveView(); boardPanDrag=null;
    const c=document.getElementById('board-canvas'); if(c) c.classList.remove('grabbing');
  }
});

/* ════════ PULSE — POMODORO FOCUS TIMER ════════ */
let pulseData = {
  focusDuration: 25,
  shortBreak: 5,
  longBreak: 15,
  sessionsUntilLong: 4,
  soundEnabled: true,
  history: []
};
let pulseState = {
  mode: 'focus',
  running: false,
  secondsLeft: 25 * 60,
  sessionCount: 0,
  activeTask: null,
  raf: null,
  lastTick: null
};
const PULSE_KEY = 'ndz-pulse-v1';
function savePulse() { try { localStorage.setItem(PULSE_KEY, JSON.stringify({...pulseData,_activeTask:pulseState.activeTask,_sessionCount:pulseState.sessionCount})); } catch(e) {} } // FIX: persist
function loadPulse() {
  try {
    const p = JSON.parse(localStorage.getItem(PULSE_KEY));
    if (p) { pulseData = { ...pulseData, ...p }; if(p._activeTask) pulseState.activeTask=p._activeTask; if(p._sessionCount) pulseState.sessionCount=p._sessionCount; } // FIX: persist
  } catch(e) {}
}
function pulseGetTotal() {
  if (pulseState.mode === 'focus') return pulseData.focusDuration;
  if (pulseState.mode === 'short') return pulseData.shortBreak;
  return pulseData.longBreak;
}
function pulsePlaySound() {
  if (!pulseData.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[523,0,0.15],[659,0.2,0.15],[784,0.4,0.3]].forEach(([freq,delay,dur]) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + dur + 0.05);
    });
  } catch(e) {}
}
function pulseUpdateTopbar() {
  let ind = document.getElementById('pulse-topbar');
  if (!pulseState.running) { if (ind) ind.remove(); return; }
  if (!ind) {
    ind = document.createElement('div');
    ind.id = 'pulse-topbar';
    ind.style.cssText = 'display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ndz-accent);font-family:var(--font);cursor:pointer;padding:2px 8px;border-radius:6px;background:var(--ndz-accent-dim);margin-left:8px;';
    ind.addEventListener('click', () => {
      const pw = windows.find(w => w.appId === 'pulse');
      if (pw) setFocusedApp('pulse'); else launchApp('pulse');
    });
    document.getElementById('tb-right')?.prepend(ind);
  }
  const m = Math.floor(pulseState.secondsLeft / 60), s = Math.floor(pulseState.secondsLeft % 60);
  ind.textContent = `▶ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function pulseRenderTimer() {
  const wrap = document.querySelector('.pulse-wrap');
  if (!wrap) return;
  const m = Math.floor(pulseState.secondsLeft / 60), s = Math.floor(pulseState.secondsLeft % 60);
  const timeEl = wrap.querySelector('#pulse-time');
  if (timeEl) timeEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const circ = 2 * Math.PI * 100;
  const offset = circ * (1 - pulseState.secondsLeft / (pulseGetTotal() * 60));
  const ring = wrap.querySelector('#pulse-ring-progress');
  if (ring) ring.style.strokeDashoffset = offset;
  pulseUpdateTopbar();
}
function pulseStart() {
  pulseState.running = true;
  pulseState.lastTick = performance.now();
  function tick(now) {
    if (!pulseState.running) return;
    const delta = (now - pulseState.lastTick) / 1000;
    pulseState.lastTick = now;
    pulseState.secondsLeft = Math.max(0, pulseState.secondsLeft - delta);
    pulseRenderTimer();
    if (pulseState.secondsLeft <= 0) { pulseState.running = false; pulseOnComplete(); return; }
    pulseState.raf = requestAnimationFrame(tick);
  }
  pulseState.raf = requestAnimationFrame(tick);
}
function pulsePause() {
  pulseState.running = false;
  if (pulseState.raf) { cancelAnimationFrame(pulseState.raf); pulseState.raf = null; }
}
function pulseFullRender() {
  const win = windows.find(w => w.appId === 'pulse');
  if (!win) return;
  const body = document.querySelector(`#win-${win.id} .wnd-body`);
  if (body) renderPulseApp(body);
}
function pulseAutoAdvance() {
  if (pulseState.mode === 'focus') {
    pulseState.mode = pulseState.sessionCount % pulseData.sessionsUntilLong === 0 ? 'long' : 'short';
  } else {
    pulseState.mode = 'focus';
  }
  pulseState.secondsLeft = pulseGetTotal() * 60;
  pulseState.running = false;
}
function pulseMarkRiftTaskDone(taskId) {

  if (task) {
    task.done = true; saveTodo(); savePulse(); refreshAppIfOpen('rift'); refreshAppIfOpen('board'); // FIX: persist
    const rw = windows.find(w => w.appId === 'rift');
    if (rw) { const b = document.querySelector(`#win-${rw.id} .wnd-body`); if (b) renderTodoApp(b); }
  }
}

function pulseOnComplete() {
  pulsePlaySound();
  pulseState.sessionCount++;

function pulseStatsText() {
  const today = new Date().toDateString();

  const skipBtn = wrap.querySelector('#pulse-skip');

  });
  const clearBtn = wrap.querySelector('#pulse-clear-task');

/* ── NOIR ↔ RIFT: sync linked goal progress ── */
function syncGoalProgress() {
  if (!noirData?.goals?.length) return;
  let changed = false;
  noirData.goals.forEach(g => {
    if (!g.linkedTaskIds?.length) return;
    const total = g.linkedTaskIds.length;
    const done = g.linkedTaskIds.filter(id => todoData.items.find(t => t.id === id && t.done)).length;
    const newProg = Math.round((done / total) * 100);
    if (g.progress !== newProg) { g.progress = newProg; changed = true; }
    if (done === total && !g.done) { g.done = true; changed = true; }
  });
  if (changed) saveNoir();
}

/* FIX 11: refresh app if open */
function refreshAppIfOpen(appId){
  const w=windows.find(w=>w.appId===appId && !w.minimized);
  if(!w) return;
  const body=document.getElementById('wnd-body-'+w.id);
  if(!body) return;
  if(appId==='rift') renderTodoApp(body);
  else if(appId==='board') renderBoardApp(body);
  else if(appId==='flow') renderFlowApp(body);
  else if(appId==='noir') { syncGoalProgress(); renderNoirApp(body); }
  else if(appId==='pulse') renderPulseApp(body);
}

    const doneCount = done_items.length;
    const total = todoData.items.length;
    const todayN = todoData.items.filter(t=>t.date===today && !t.done).length;
    const pct = total ? Math.round(doneCount/total*100) : 0;
    root.querySelector('[data-count]').textContent = openCount===0 ? 'All done 🎉' : `${openCount} open`;
    root.querySelector('[data-st="total"]').textContent = total;
    root.querySelector('[data-st="open"]').textContent  = openCount;
    root.querySelector('[data-st="done"]').textContent  = doneCount;
    root.querySelector('[data-st="today"]').textContent = todayN;
    root.querySelector('[data-pct]').textContent = pct+'%';
    root.querySelector('[data-prog]').style.width = pct+'%';
    emptyEl.style.display = vis.length===0 ? 'block' : 'none';
  }

  function addTodo(){
    const text = inputEl.value.trim();
    if(!text) return;
    todoData.items.unshift({ id:Date.now()+Math.floor(Math.random()*1000), text, done:false, prio:prioEl.value, date:today });
    inputEl.value=''; saveTodo(); paint();
  }

  root.querySelector('[data-add]').addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') addTodo(); });
  listEl.addEventListener('click', e=>{
    const pulseId=e.target.dataset.pulse;
    if(pulseId){
      e.stopPropagation();
      const id=parseInt(pulseId);
      const task=todoData.items.find(t=>t.id===id);
      if(!task) return;
      pulseState.activeTask={id:task.id,text:task.text};
      pulseState.mode='focus';
      pulseState.secondsLeft=pulseData.focusDuration*60;
      pulseState.running=false;
      const pulseWin=windows.find(w=>w.appId==='pulse');
      if(pulseWin){const pb=document.querySelector(`#win-${pulseWin.id} .wnd-body`);if(pb)renderPulseApp(pb);setFocusedApp('pulse');}
      else launchApp('pulse');
      showToast('PULSE',`"${task.text.slice(0,30)}" loaded`,'linear-gradient(145deg,#1a1030,#7B5CF0)');
      return;
    }
    const flowId=e.target.dataset.flow;
    if(flowId){ e.stopPropagation(); todoShowFlowPicker(flowId, e.target); return; }
    const goalLinkId=e.target.dataset.goalLink;
    if(goalLinkId){ e.stopPropagation(); todoShowGoalPicker(goalLinkId, e.target); return; }
    const del = e.target.dataset.del;
    if(del){ todoData.items = todoData.items.filter(t=>t.id!=del); saveTodo(); paint(); refreshAppIfOpen('board'); return; }
    const tog = e.target.dataset.toggle || e.target.closest('[data-toggle]')?.dataset.toggle;
    if(tog){ const t = todoData.items.find(x=>x.id==tog); if(t){ t.done=!t.done; saveTodo(); paint(); refreshAppIfOpen('board'); } }
  });
  root.querySelector('[data-clear]').addEventListener('click', ()=>{ todoData.items = todoData.items.filter(t=>!t.done); saveTodo(); paint(); refreshAppIfOpen('board'); });
  root.querySelector('[data-sort]').addEventListener('click', e=>{ todoData.sortByPrio=!todoData.sortByPrio; e.target.textContent = todoData.sortByPrio?'↕ Chronological':'↕ By Priority'; saveTodo(); paint(); });
  root.querySelectorAll('[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{
      todoData.filter = b.dataset.filter;
      root.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active', x===b));
      saveTodo(); paint();
    });
  });
  /* Theme swatches */
  root.querySelectorAll('.rift-swatch').forEach(b=>{
    b.addEventListener('click', ()=>{
      todoData.theme = b.dataset.t;
      root.setAttribute('data-todo-theme', todoData.theme);
      root.querySelectorAll('.rift-swatch').forEach(x=>{
        x.style.borderColor = x.dataset.t === todoData.theme ? '#fff' : 'transparent';
      });
      saveTodo();
    });
  });
  /* Sort pills */
  root.querySelectorAll('[data-sort-val]').forEach(b=>{
    b.addEventListener('click', ()=>{
      todoData.sort = b.dataset.sortVal;
      root.querySelectorAll('[data-sort-val]').forEach(x=>x.classList.toggle('active', x===b));
      saveTodo(); paint();
    });
  });
  /* Done position pills */
  root.querySelectorAll('[data-done-pos]').forEach(b=>{
    b.addEventListener('click', ()=>{
      todoData.donePos = b.dataset.donePos;
      root.querySelectorAll('[data-done-pos]').forEach(x=>x.classList.toggle('active', x===b));
      saveTodo(); paint();
    });
  });
  paint();
}

function checkOwner(){ return !!localStorage.getItem('ndz-owner-v1'); }
function sfFmt(){ return SF_FORMATS_DEF.find(f=>f.id===sfData.format)||SF_FORMATS_DEF[0]; }
function sfReadTime(text){ const w=text.trim().split(/\s+/).length,m=w/140; return m<1?`~${Math.round(m*60)} sec`:`~${Math.floor(m)}:${String(Math.round((m%1)*60)).padStart(2,'0')} min`; }

function sfBuildPrompt(){
  const f=sfFmt();
  const inst={
    youtube:'Format: [HOOK] [INTRO] [CHAPTER 1] [CHAPTER 2] [OUTRO/CTA]. Include chapter timestamp suggestions.',
    tiktok:'Format: [HOOK] [CONTENT] [PAYOFF] [CTA]. Hook must grab in 2 seconds. Include [ON-SCREEN TEXT] cues.',
    shorts:'Format: [VISUAL: ...] [LINE] for each beat. One core idea. Loop potential.',
    podcast:'Format: [INTRO] [SEGMENT 1] [SEGMENT 2] [OUTRO]. Talking points, anecdotes, listener questions, sponsor slot.',
    ad:'Format: [HOOK] [PROBLEM] [SOLUTION] [PROOF] [CTA]. Benefit-focused. Include B-roll suggestions.',
    webinar:'Format: [WELCOME] [AGENDA] [SEGMENT 1] [SEGMENT 2] [OFFER] [Q&A]. Include [SLIDE: ...] suggestions.',
    linkedin:'Format: [HOOK] [INSIGHT] [STORY/PROOF] [TAKEAWAY] [CTA]. Bold opening, thought leadership angle.',
    pitch:'Format: [HOOK] [PROBLEM] [SOLUTION] [WHY US] [ASK]. Ultra-clear value prop in first sentence.',
  };
  return `You are an elite content scriptwriter. Write a complete, camera-ready ${f.label} script.\nFORMAT: ${f.label} | TOPIC: ${sfData.topic} | TONE: ${sfData.tone} | LENGTH: ${sfData.length}\nAUDIENCE: ${sfData.audience||'General'} | EXTRAS: ${sfData.extras||'None'}\n${inst[sfData.format]||''}\nWrite the FULL script now. Use clear section labels in [BRACKETS]. Spoken language only. No meta-commentary.`;
}
function sfBuildHooksPrompt(){
  const f=sfFmt();
  return `Generate exactly 5 different opening hooks for a ${f.label} video about: "${sfData.topic}"\nTone: ${sfData.tone} | Audience: ${sfData.audience||'General'}\nEach hook uses a DIFFERENT technique:\n1. Bold controversial statement\n2. Surprising statistic or fact\n3. Story / personal anecdote opener\n4. Direct question to viewer\n5. Pattern interrupt / unexpected angle\nFormat exactly:\nHOOK 1: [text]\nHOOK 2: [text]\nHOOK 3: [text]\nHOOK 4: [text]\nHOOK 5: [text]`;
}
function sfBuildThumbPrompt(){
  const f=sfFmt();
  return `Based on this ${f.label} script about "${sfData.topic}", generate 3 thumbnail concepts.\nScript excerpt: ${sfState.script.slice(0,400)}...\nFor each:\n--- THUMBNAIL N ---\nCONCEPT: [visual description]\nTEXT OVERLAY: [max 5 words]\nSTYLE: [visual style]\nWHY IT WORKS: [one sentence]`;
}

async function sfCallClaude(prompt){
  const apiKey=localStorage.getItem('ndz-claude-key')||'';
  const headers={'Content-Type':'application/json','anthropic-version':'2023-06-01'};
  if(apiKey) headers['x-api-key']=apiKey;
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers,
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4000,messages:[{role:'user',content:prompt}]}) // FIX: 1
  });
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||'API error');
  return data.content?.map(b=>b.text||'').join('')||'';
}

async function sfGenerate(isRegen){
  if(!sfData.topic.trim()) return;
  sfState.loading=true;
  if(!isRegen){ sfState.step=3; sfState.hooks=[]; sfState.thumbs=''; sfState.hooksOpen=false; sfState.thumbsOpen=false; sfState.script=''; }
  sfRenderActive();
  try{
    const text=await sfCallClaude(sfBuildPrompt());
    sfState.script=text;
    const ver={text,label:`v${sfState.versions.length+1} · ${sfData.tone}`,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
    sfState.versions.push(ver);
    sfState.activeVer=sfState.versions.length-1;
  }catch(e){ sfState.script=`⚠ ${e.message||'Please add your Claude API key in the field below.'}`;  }
  sfState.loading=false;
  saveSFState(); // FIX: persist
  sfRenderActive();
}
async function sfGenHooks(){
  sfState.loadingHooks=true; sfState.hooksOpen=true; sfRenderStep3();
  try{
    const text=await sfCallClaude(sfBuildHooksPrompt());
    sfState.hooks=text.split(/HOOK \d+:/).filter(Boolean).map(h=>h.trim()).filter(Boolean);
  }catch(e){ sfState.hooks=[`⚠ ${e.message}`]; }
  sfState.loadingHooks=false; saveSFState(); sfRenderStep3(); // FIX: persist
}
async function sfGenThumbs(){
  sfState.loadingThumbs=true; sfState.thumbsOpen=true; sfRenderStep3();
  try{ sfState.thumbs=await sfCallClaude(sfBuildThumbPrompt()); }
  catch(e){ sfState.thumbs=`⚠ ${e.message}`; }
  sfState.loadingThumbs=false; saveSFState(); sfRenderStep3(); // FIX: persist
}

function sfReset(){ // FIX: 4
  sfState={step:1,script:'',versions:[],activeVer:0,loading:false,copied:false,hooks:[],loadingHooks:false,hooksOpen:false,thumbs:'',loadingThumbs:false,thumbsOpen:false};
  sfData.topic=''; sfData.audience=''; sfData.extras=''; saveSF(); saveSFState(); sfRenderActive(); // FIX: 4 FIX: persist
}
function sfRenderActive(){
  windows.filter(w=>w.appId==='scriptforge').forEach(w=>{
    const body=document.getElementById('wnd-body-'+w.id); if(body) renderScriptForgeApp(body);
  });
}
function sfRenderStep3(){
  windows.filter(w=>w.appId==='scriptforge').forEach(w=>{
    const body=document.getElementById('wnd-body-'+w.id); if(!body) return;
    const inner=body.querySelector('#sf-body-inner');
    if(inner&&sfState.step===3){ inner.innerHTML=sfBuildStep3Html(); sfBindStep3(body); }
  });
}

function sfUnlockPrompt(){
  const pass=localStorage.getItem('ndz-owner-pass');
  const entered=window.prompt(pass?'Enter owner passphrase:':'Set owner passphrase (first-time setup):','');
  if(entered===null) return;
  if(!pass){
    localStorage.setItem('ndz-owner-pass',entered);
    localStorage.setItem('ndz-owner-v1','1');
    showToast('Script Forge','Owner mode enabled — you can now generate scripts','linear-gradient(145deg,#1a0e04,#F59E0B)');
    sfRenderActive();
  } else if(entered===pass){
    localStorage.setItem('ndz-owner-v1','1');
    showToast('Script Forge','Owner mode enabled','linear-gradient(145deg,#1a0e04,#F59E0B)');
    sfRenderActive();
  } else {
    showToast('Script Forge','Wrong passphrase','linear-gradient(145deg,#3b0000,#EF4444)');
  }
}

/* ── Teleprompter ── */
function sfEnsureTeleprompter(){
  if(document.getElementById('sf-teleprompter')) return;
  const tp=document.createElement('div');
  tp.id='sf-teleprompter';
  tp.innerHTML=`
    <div id="sf-tp-bar">
      <span class="sf-tp-label">📺 TELEPROMPTER</span>
      <button class="sf-tp-btn" id="sf-tp-play" style="background:#F59E0B;color:#000">▶ START</button>
      <div class="sf-tp-range">Speed
        <input type="range" min="1" max="10" value="2" id="sf-tp-speed" style="width:60px;accent-color:#F59E0B">
        <span id="sf-tp-speed-val" style="color:#fff;font-weight:700;min-width:22px">2x</span>
      </div>
      <div class="sf-tp-range">Size
        <input type="range" min="20" max="72" value="36" id="sf-tp-size" style="width:60px;accent-color:#F59E0B">
      </div>
      <button class="sf-tp-btn" id="sf-tp-reset" style="background:transparent;border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.6)">↩ Reset</button>
      <button class="sf-tp-btn" id="sf-tp-close" style="background:transparent;border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.6);margin-left:auto">✕ Close</button>
    </div>
    <div style="position:relative;flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div id="sf-tp-reticle"></div>
      <div id="sf-tp-scroll"><p id="sf-tp-text"></p><div style="height:60vh"></div></div>
    </div>`;
  document.body.appendChild(tp);
  document.getElementById('sf-tp-play').addEventListener('click',sfTpToggle);
  document.getElementById('sf-tp-reset').addEventListener('click',()=>{
    sfTpPos=0; cancelAnimationFrame(sfTpRAF); sfTpRunning=false;
    const sc=document.getElementById('sf-tp-scroll'); if(sc) sc.scrollTop=0;
    const btn=document.getElementById('sf-tp-play');
    if(btn){ btn.textContent='▶ START'; btn.style.background=sfFmt().color; btn.style.color='#fff'; }
  });
  document.getElementById('sf-tp-close').addEventListener('click',sfCloseTeleprompter);
  document.getElementById('sf-tp-speed').addEventListener('input',e=>{
    sfTpSpeed=+e.target.value;
    const v=document.getElementById('sf-tp-speed-val'); if(v) v.textContent=sfTpSpeed+'x';
  });
  document.getElementById('sf-tp-size').addEventListener('input',e=>{
    sfTpSize=+e.target.value;
    const t=document.getElementById('sf-tp-text'); if(t) t.style.fontSize=sfTpSize+'px';
  });
}
function sfOpenTeleprompter(){
  sfEnsureTeleprompter();
  const tp=document.getElementById('sf-teleprompter');
  const fmt=sfFmt();
  const clean=sfState.script.replace(/\[(?:HOOK|INTRO|OUTRO|CTA|CHAPTER \d+|SEGMENT \d+|ON-SCREEN TEXT|VISUAL|SLIDE)[^\]]*\]/g,'').replace(/\n{3,}/g,'\n\n').trim();
  document.getElementById('sf-tp-text').textContent=clean;
  document.getElementById('sf-tp-text').style.fontSize='36px';
  document.getElementById('sf-tp-bar').style.setProperty('--sf-tp-color',fmt.color);
  document.getElementById('sf-tp-bar').style.borderBottomColor=fmt.color;
  document.getElementById('sf-tp-reticle').style.background=fmt.color;
  const pb=document.getElementById('sf-tp-play');
  if(pb){ pb.textContent='▶ START'; pb.style.background=fmt.color; pb.style.color='#000'; }
  sfTpPos=0; sfTpRunning=false; sfTpSpeed=2; sfTpSize=36;
  cancelAnimationFrame(sfTpRAF);
  const sc=document.getElementById('sf-tp-scroll'); if(sc) sc.scrollTop=0;
  tp.classList.add('open');
  document.body.style.cursor='none';
}
function sfCloseTeleprompter(){ // FIX: 5
  cancelAnimationFrame(sfTpRAF); sfTpRunning=false; // FIX: 5 — always cancel RAF first
  const tp=document.getElementById('sf-teleprompter');
  if(tp){ tp.remove(); } // FIX: 5 — remove element from DOM so interval/RAF state is fully cleared
  document.body.style.cursor='';
}
function sfTpTick(){
  sfTpPos+=sfTpSpeed*0.35;
  const sc=document.getElementById('sf-tp-scroll');
  if(sc){ sc.scrollTop=sfTpPos; }
  sfTpRAF=requestAnimationFrame(sfTpTick);
}
function sfTpToggle(){
  sfTpRunning=!sfTpRunning;
  const btn=document.getElementById('sf-tp-play'); const fmt=sfFmt();
  if(sfTpRunning){ if(btn){ btn.textContent='⏸ PAUSE'; btn.style.background='#EF4444'; btn.style.color='#fff'; } sfTpRAF=requestAnimationFrame(sfTpTick); }
  else{ cancelAnimationFrame(sfTpRAF); if(btn){ btn.textContent='▶ RESUME'; btn.style.background=fmt.color; btn.style.color='#000'; } }
}

function sfBuildStep3Html(){

  if(sfState.loading){
    return `<div class="sf-loading-state">
      <div style="font-size:28px;color:${f.color};display:inline-block;animation:sfSpin 1.8s linear infinite">✦</div>
      <div style="font-size:13.5px;color:var(--t2);font-family:'Bebas Neue',var(--font);letter-spacing:.12em;margin-top:10px">WRITING YOUR SCRIPT</div>
      <div style="font-size:11.5px;color:var(--t3);font-family:'Rajdhani',var(--font);margin-top:4px">Claude is crafting your ${f.label} script…</div>
    </div>`;
  }

  const versionPills=sfState.versions.length>1?
    `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
      ${sfState.versions.map((v,i)=>`<button class="sf-version-pill" data-sf-ver="${i}"
        style="${sfState.activeVer===i?`background:${f.color}1a;border-color:${f.color}55;color:#fff`:''}">${v.label} <span style="opacity:.55;font-size:9.5px">${v.time}</span></button>`).join('')}
    </div>`:'' ;

  const metaBar=sfState.script?`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <span class="sf-tag" style="background:${f.color}22;color:${f.color}">${f.label.toUpperCase()}</span>
    <span style="font-size:11px;color:var(--t3);font-family:'Rajdhani',var(--font)">${sfData.tone} · ${sfData.length}</span>
    <span style="font-size:11px;color:var(--t3)">⏱ ${sfReadTime(sfState.script)}</span>
    <div style="flex:1"></div>
    <button class="sf-action-btn dark" id="sf-tp-open" style="flex:none;font-size:11px;padding:6px 13px">📺 Teleprompter</button>
    <button class="sf-action-btn dark" id="sf-copy-btn" style="flex:none;font-size:11px;padding:6px 13px${sfState.copied?';background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.3);color:#34d399':''}">
      ${sfState.copied?'✓ Copied':'Copy All'}
    </button>
  </div>`:`<div style="font-family:'Bebas Neue',var(--font);font-size:16px;letter-spacing:.04em;color:var(--t2);margin-bottom:10px">${sfData.topic||'Your Script'}</div>`;

  const scriptBlock=sfState.script?
    `<div class="sf-card">
      <div class="sf-card-top-bar" style="background:${f.color}"></div>
      <div id="sf-script-body"><pre class="sf-script-pre">${sfState.script.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre></div>
    </div>`
    :`<div class="sf-loading-state"><div style="color:var(--t3);font-size:12px;font-family:'Rajdhani',var(--font)">No script yet.</div></div>`;

  const actionRow=sfState.script?`<div class="sf-action-row" style="margin-top:10px">
    <button class="sf-action-btn ghost" id="sf-regen-btn" style="border-color:${f.color}55;color:${f.color}">↺ Regenerate</button>
    <button class="sf-action-btn ghost" id="sf-hooks-btn">${sfState.loadingHooks?'<span class="sf-loading-ring"></span>Hooks…':'🪝 Hook Ideas'}</button>
    <button class="sf-action-btn ghost" id="sf-thumbs-btn">${sfState.loadingThumbs?'<span class="sf-loading-ring"></span>Concepts…':'🖼 Thumbnails'}</button>
    <button class="sf-action-btn dark" id="sf-new-script-btn">+ New Script</button>
  </div>`:'';

  const hooksPanel=sfState.hooksOpen?`<div style="margin-top:10px;border:1px solid rgba(16,185,129,0.22);border-radius:10px;background:rgba(16,185,129,0.04);overflow:hidden">
    <div style="padding:10px 14px;border-bottom:1px solid rgba(16,185,129,0.14);font-family:'Bebas Neue',var(--font);font-size:14px;letter-spacing:.1em;color:rgba(52,211,153,0.85)">🪝 HOOK IDEAS</div>
    <div style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">
      ${sfState.loadingHooks?`<div style="color:var(--t3);font-size:12px;font-family:'Rajdhani',var(--font)"><span class="sf-loading-ring"></span>Generating 5 hooks…</div>`:
        sfState.hooks.map((h,i)=>`<div class="sf-hook-card"><span class="sf-hook-num">${i+1}</span><div style="font-size:13px;line-height:1.6;color:var(--t1);font-family:'Rajdhani',var(--font);cursor:pointer" data-copy-hook="${i}" title="Click to copy">${h}</div></div>`).join('')}
    </div>
  </div>`:'';

  const thumbsPanel=sfState.thumbsOpen?`<div style="margin-top:10px;border:1px solid rgba(245,158,11,0.22);border-radius:10px;background:rgba(245,158,11,0.04);overflow:hidden">
    <div style="padding:10px 14px;border-bottom:1px solid rgba(245,158,11,0.14);font-family:'Bebas Neue',var(--font);font-size:14px;letter-spacing:.1em;color:rgba(245,190,60,0.85)">🖼 THUMBNAIL CONCEPTS</div>
    <div style="padding:12px 16px">
      ${sfState.loadingThumbs?`<div style="color:var(--t3);font-size:12px;font-family:'Rajdhani',var(--font)"><span class="sf-loading-ring"></span>Generating concepts…</div>`:
        `<div class="sf-thumbs-block">${sfState.thumbs||''}</div>`}
    </div>
  </div>`:'';

  return `<div style="display:flex;flex-direction:column;gap:0">${metaBar}${versionPills}${scriptBlock}${actionRow}${hooksPanel}${thumbsPanel}</div>`;
}

function sfBindEvents(body){
  body.querySelectorAll('[data-sf-fmt]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      sfData.format=btn.dataset.sfFmt;
      const lens=SF_LENGTHS[sfData.format]||['Short','Medium','Long'];
      sfData.length=lens[1]||lens[0]; saveSF(); sfState.step=2; sfRenderActive();
    });
  });
  const bk=body.querySelector('[data-sf-backstep]');
  if(bk) bk.addEventListener('click',()=>{ sfState.step=1; sfRenderActive(); });

  const topicInp=body.querySelector('#sf-topic');
  if(topicInp){
    topicInp.addEventListener('input',()=>{
      sfData.topic=topicInp.value; saveSF();
      const genBtn=body.querySelector('#sf-gen-main');
      if(genBtn){
        const f2=sfFmt();
        genBtn.disabled=!sfData.topic.trim();
        genBtn.style.background=sfData.topic.trim()?f2.color:'rgba(255,255,255,0.07)';
        genBtn.style.color=sfData.topic.trim()?'#fff':'var(--t3)';
        genBtn.style.boxShadow=sfData.topic.trim()?`0 6px 24px ${f2.color}44`:'none';
      }
    });
  }
  const audInp=body.querySelector('#sf-audience');
  if(audInp) audInp.addEventListener('input',()=>{ sfData.audience=audInp.value; saveSF(); });
  const extInp=body.querySelector('#sf-extras');
  if(extInp) extInp.addEventListener('input',()=>{ sfData.extras=extInp.value; saveSF(); });
  const keyInp=body.querySelector('#sf-apikey');
  if(keyInp) keyInp.addEventListener('input',()=>{ localStorage.setItem('ndz-claude-key',keyInp.value.trim()); }); // FIX: 2

  body.querySelectorAll('[data-sf-tone]').forEach(btn=>{
    btn.addEventListener('click',()=>{ sfData.tone=btn.dataset.sfTone; saveSF(); sfRenderActive(); });
  });
  body.querySelectorAll('[data-sf-len]').forEach(btn=>{
    btn.addEventListener('click',()=>{ sfData.length=btn.dataset.sfLen; saveSF(); sfRenderActive(); });
  });

  const genBtn=body.querySelector('#sf-gen-main');
  if(genBtn) genBtn.addEventListener('click',()=>{ if(!sfData.topic.trim()) return; sfGenerate(false); });

  const newBtn=body.querySelector('#sf-new-btn');
  if(newBtn) newBtn.addEventListener('click',sfReset);

  sfBindStep3(body);
}

function sfBindStep3(body){
  const copyBtn=body.querySelector('#sf-copy-btn');
  if(copyBtn) copyBtn.addEventListener('click',()=>{
    navigator.clipboard.writeText(sfState.script).catch(()=>{
      const ta=document.createElement('textarea'); ta.value=sfState.script; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    });
    sfState.copied=true; sfRenderStep3();
    setTimeout(()=>{ sfState.copied=false; sfRenderStep3(); },2000);
  });
  const tpOpen=body.querySelector('#sf-tp-open');
  if(tpOpen) tpOpen.addEventListener('click',sfOpenTeleprompter);
  const regenBtn=body.querySelector('#sf-regen-btn');
  if(regenBtn) regenBtn.addEventListener('click',()=>sfGenerate(true));
  const hooksBtn=body.querySelector('#sf-hooks-btn');
  if(hooksBtn) hooksBtn.addEventListener('click',sfGenHooks);
  const thumbsBtn=body.querySelector('#sf-thumbs-btn');
  if(thumbsBtn) thumbsBtn.addEventListener('click',sfGenThumbs);
  const newScriptBtn=body.querySelector('#sf-new-script-btn');
  if(newScriptBtn) newScriptBtn.addEventListener('click',sfReset);
  body.querySelectorAll('[data-sf-ver]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.sfVer;
      sfState.activeVer=i; sfState.script=sfState.versions[i].text; saveSFState(); sfRenderStep3(); // FIX: persist
    });
  });
  body.querySelectorAll('[data-copy-hook]').forEach(el=>{
    el.addEventListener('click',()=>{
      const txt=sfState.hooks[+el.dataset.copyHook];
      if(txt) navigator.clipboard.writeText(txt).catch(()=>{});
      showToast('Script Forge','Hook copied to clipboard','linear-gradient(145deg,#1a0e04,#F59E0B)');
    });
  });
}
</script>
