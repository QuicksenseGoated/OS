  const results=document.getElementById('spotlight-results');
  const items=Array.from(results.querySelectorAll('.spot-result'));
  if(!items.length) return;
  let cur=items.findIndex(el=>el.classList.contains('spot-active'));
  if(e.key==='ArrowDown'){ e.preventDefault(); // FIX: 12
    if(cur>=0) items[cur].classList.remove('spot-active');
    cur=(cur+1)%items.length; items[cur].classList.add('spot-active'); items[cur].scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowUp'){ e.preventDefault(); // FIX: 12
    if(cur>=0) items[cur].classList.remove('spot-active');
    cur=cur<=0?items.length-1:cur-1; items[cur].classList.add('spot-active'); items[cur].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){ // FIX: 12
    if(cur>=0) items[cur].click();
  }
});
/* FIX 3: Spotlight Content Search */
function renderSpotlightResults(q) {
  const results = document.getElementById('spotlight-results');
  const query = q.trim().toLowerCase();

  if (!query) {
    results.innerHTML = `<div class="spot-group-label">Applications</div>` +
      APPS.slice(0, 6).map(app => spotAppRow(app)).join('');
    bindSpotResults(results);
    return;
  }

  const sections = [];

  const appMatches = APPS.filter(a => a.name.toLowerCase().includes(query));
  if (appMatches.length) {
    sections.push({
      label: 'Applications',
      rows: appMatches.map(app => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,${app.gradient[0]},${app.gradient[1]})">${app.dockSvg || app.svg || ''}</div>`,
        title: app.name, sub: 'NDZ OS Application',
        action: () => { launchApp(app.id); closeSpotlight(); }
      }))
    });
  }

  const journalHits = (noirData.journal || []).filter(j =>
    j.content?.toLowerCase().includes(query) || j.date?.toLowerCase().includes(query)
  ).slice(0, 3);
  if (journalHits.length) {
    sections.push({
      label: 'NOIR — Journal',
      rows: journalHits.map(j => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,#0d0820,#1a1030)"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="4" y="4" width="16" height="16" rx="3" stroke="rgba(180,140,255,0.7)" stroke-width="1.5" fill="none"/><line x1="7" y1="9" x2="17" y2="9" stroke="rgba(180,140,255,0.6)" stroke-width="1.2" stroke-linecap="round"/><line x1="7" y1="13" x2="14" y2="13" stroke="rgba(180,140,255,0.4)" stroke-width="1.2" stroke-linecap="round"/></svg></div>`,
        title: j.date || 'Journal Entry',
        sub: (j.content || '').slice(0, 60) + (j.content?.length > 60 ? '…' : ''),
        action: () => { launchApp('noir'); closeSpotlight(); }
      }))
    });
  }

  const hookHits = (noirData.hooks || []).filter(h =>
    h.text?.toLowerCase().includes(query)
  ).slice(0, 3);
  if (hookHits.length) {
    sections.push({
      label: 'NOIR — Hooks',
      rows: hookHits.map(h => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,#0d0820,#1a1030)"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 4 C16 4 19 7 19 11 C19 15 16 17 12 17 L12 20" stroke="rgba(180,140,255,0.7)" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></div>`,
        title: h.text.slice(0, 50) + (h.text.length > 50 ? '…' : ''),
        sub: 'NOIR · Hook',
        action: () => { launchApp('noir'); closeSpotlight(); }
      }))
    });
  }

  const ideaHits = (noirData.ideas || []).filter(i =>
    i.text?.toLowerCase().includes(query)
  ).slice(0, 3);
  if (ideaHits.length) {
    sections.push({
      label: 'NOIR — Ideas',
      rows: ideaHits.map(i => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,#0d0820,#1a1030)"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="12" cy="10" r="5" stroke="rgba(180,140,255,0.7)" stroke-width="1.5" fill="none"/><line x1="12" y1="15" x2="12" y2="19" stroke="rgba(180,140,255,0.5)" stroke-width="1.5" stroke-linecap="round"/></svg></div>`,
        title: i.text.slice(0, 50) + (i.text.length > 50 ? '…' : ''),
        sub: 'NOIR · Idea',
        action: () => { launchApp('noir'); closeSpotlight(); }
      }))
    });
  }

  const scriptHits = (noirData.scripts || []).filter(s =>
    s.title?.toLowerCase().includes(query) || s.content?.toLowerCase().includes(query)
  ).slice(0, 3);
  if (scriptHits.length) {
    sections.push({
      label: 'NOIR — Scripts',
      rows: scriptHits.map(s => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,#0d0820,#1a1030)"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="4" y="3" width="16" height="18" rx="2" stroke="rgba(180,140,255,0.7)" stroke-width="1.5" fill="none"/><line x1="7" y1="8" x2="17" y2="8" stroke="rgba(180,140,255,0.5)" stroke-width="1.2" stroke-linecap="round"/><line x1="7" y1="12" x2="13" y2="12" stroke="rgba(180,140,255,0.4)" stroke-width="1.2" stroke-linecap="round"/></svg></div>`,
        title: s.title || 'Untitled Script',
        sub: 'NOIR · Script',
        action: () => { launchApp('noir'); closeSpotlight(); }
      }))
    });
  }

  const flowCardHits = [];
  (flowData.columns || []).forEach(col => {
    (col.cards || []).forEach(card => {
      if (card.title?.toLowerCase().includes(query) || card.note?.toLowerCase().includes(query)) {
        flowCardHits.push({ ...card, colName: col.title });
      }
    });
  });
  if (flowCardHits.length) {
    sections.push({
      label: 'FLOW — Kanban',
      rows: flowCardHits.slice(0, 4).map(card => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,#0a1a10,#0d2010)"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="3" y="5" width="5" height="14" rx="1.5" fill="rgba(100,220,140,0.4)"/><rect x="10" y="5" width="5" height="9" rx="1.5" fill="rgba(100,220,140,0.65)"/><rect x="17" y="5" width="4" height="6" rx="1.5" fill="rgba(100,220,140,0.85)"/></svg></div>`,
        title: card.title,
        sub: `FLOW · ${card.colName}`,
        action: () => { launchApp('flow'); closeSpotlight(); }
      }))
    });
  }

  const boardHits = [];
  (boardData.boards||[]).forEach(b => {
    (b.nodes||[]).forEach(node => {
      const text = node.data?.content || node.data?.text || node.data?.title || '';
      if (text.toLowerCase().includes(query)) boardHits.push({ boardName:b.name, text, type:node.type });
    });
  });
  if (boardHits.length) {
    sections.push({
      label: 'BOARD — Canvas',
      rows: boardHits.slice(0,3).map(hit => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,#0a0f1a,#0f1a2a)"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="3" y="3" width="8" height="7" rx="1.5" fill="rgba(150,210,255,0.7)"/><rect x="13" y="3" width="8" height="10" rx="1.5" fill="rgba(150,210,255,0.4)"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="rgba(150,210,255,0.5)"/></svg></div>`,
        title: hit.text.slice(0,50), sub:`BOARD · ${hit.boardName}`,
        action: () => { launchApp('board'); closeSpotlight(); }
      }))
    });
  }

  const todoHits = (todoData?.items || []).filter(t =>
    t.text?.toLowerCase().includes(query)
  ).slice(0, 4);
  if (todoHits.length) {
    sections.push({
      label: 'RIFT — Tasks',
      rows: todoHits.map(t => ({
        icon: `<div class="spot-result-icon" style="background:linear-gradient(145deg,#1a1030,#0d0820)"><svg viewBox="0 0 24 24" fill="none" width="16" height="16"><rect x="4" y="6" width="12" height="2.5" rx="1.25" fill="rgba(180,150,255,0.8)"/><rect x="4" y="11" width="8" height="2.5" rx="1.25" fill="rgba(180,150,255,0.5)"/><path d="M15 11 L17 13.5 L21 9" stroke="rgba(180,150,255,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>`,
        title: t.text.slice(0, 50) + (t.text.length > 50 ? '…' : ''),
        sub: t.done ? 'RIFT · Done' : 'RIFT · Open',
        action: () => { launchApp('rift'); closeSpotlight(); }
      }))
    });
  }

  if (sections.length === 0) {
    results.innerHTML = `<div id="spot-no-results">No results for "${q}"</div>`;
    return;
  }

  results.innerHTML = sections.map(sec => `
    <div class="spot-group-label">${sec.label}</div>
    ${sec.rows.map((row, i) => `
      <div class="spot-result" data-sec="${sec.label}" data-idx="${i}">
        ${row.icon}
        <div>
          <div class="spot-result-name">${row.title}</div>
          <div class="spot-result-sub">${row.sub}</div>
        </div>
      </div>`).join('')}
  `).join('');

  const allActions = sections.flatMap(sec => sec.rows.map(r => r.action));
  results.querySelectorAll('.spot-result').forEach((el, i) => {
    el.addEventListener('click', () => allActions[i]?.());
  });
}

function showCtxMenu(x,y,sections){
  const menu=document.getElementById('ctx-menu');
  let html='';
  sections.forEach((sec,si)=>{
    if(si>0) html+='<div class="ctx-sep"></div>';
    if(sec.label) html+=`<div class="ctx-group-label">${sec.label}</div>`;
    sec.items.forEach(item=>{
      html+=`<div class="ctx-item${item.danger?' danger':''}" data-idx="${si}-${sec.items.indexOf(item)}">${item.icon?`<span>${item.icon}</span>`:''}<span>${item.label}</span>${item.shortcut?`<span class="ctx-shortcut">${item.shortcut}</span>`:''}</div>`;
    });
  });
  menu.innerHTML=html;
  const safeX=Math.min(x,window.innerWidth-220),safeY=Math.min(y,window.innerHeight-200);
  menu.style.left=safeX+'px';menu.style.top=safeY+'px';
  menu.classList.add('open');
  menu.querySelectorAll('.ctx-item').forEach((el,idx)=>{
    const allItems=sections.flatMap(s=>s.items);
    el.addEventListener('click',()=>{ allItems[idx]?.onClick();hideCtxMenu(); });
  });
}

/* ════════ TOASTS ════════ */
function showToast(title,msg,gradient='linear-gradient(145deg,#9B6DFF,#5B30D4)'){
  const n=new Date();const time=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  const id='toast-'+Date.now();
  const el=document.createElement('div');el.className='toast';el.id=id;
  el.innerHTML=`<div class="toast-icon" style="background:${gradient}"></div><div style="flex:1;min-width:0"><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div><div class="toast-time">${time}</div>`;
  const _ta=document.getElementById('toast-area');
  while(_ta.children.length>=3){ _ta.firstChild?.remove(); } // FIX: 11
  _ta.appendChild(el);
  Array.from(_ta.children).forEach((t,i)=>{ t.style.bottom=(i*66)+'px'; }); // FIX: 11 — stack toasts 66px apart so they don't overlap
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateX(14px)';setTimeout(()=>el.remove(),300); },3600);
}

/* ════════ SETTINGS ENGINE — APPLY EFFECTS ════════ */
function applyEffect(key,val){
  const root=document.documentElement;
  switch(key){
    case 'wallpaper': {
      const t=WP_THEMES[val]||WP_THEMES.void;
      applyWpTheme(t);
      animateToColour(t.pr[0], t.pr[1], t.pr[2]);
      break;
    }
    case 'wpBlur': case 'wpBrightness': {
      const f=[];
      if(S.wpBlur>0) f.push(`blur(${S.wpBlur}px)`);
      if(S.wpBrightness!==100) f.push(`brightness(${S.wpBrightness/100})`);
      const v=f.join(' ')||'none';
      ['wp-base','wp-nebula','wp-media'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.filter=v;});break;
    }
    case 'parallaxIntensity': break;
    case 'ambientLight': {
      const op=(val/100).toFixed(2);
      ['wp-parallax-light','wp-ambient'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.opacity=op;});break;
    }
    case 'particles': document.getElementById('wp-particles').style.opacity=val?.7:0;break;
    case 'particleDensity': buildParticles();break;
    case 'starDensity': buildStars();break;
    case 'nebulaIntensity': document.getElementById('wp-nebula').style.opacity=(val/100).toFixed(2);break;
    case 'filmGrain': document.getElementById('wp-grain').style.opacity=val?.028:0;break;
    case 'vignetteIntensity': document.getElementById('wp-vignette').style.opacity=(val/100).toFixed(2);break;
    case 'horizonGlow': document.getElementById('wp-horizon').style.opacity=(val/100).toFixed(2);break;
    case 'blurIntensity':
      root.style.setProperty('--blur',`blur(${val}px) saturate(180%)`);
      root.style.setProperty('--blur-sm',`blur(${Math.round(val*.5)}px) saturate(160%)`);break;
    case 'iconGlowIntensity': { const [ir,ig,ib]=wpTheme.pr; root.style.setProperty('--icon-glow',`rgba(${ir},${ig},${ib},${((val/100)*.6).toFixed(2)})`);break; }
    case 'iconTransparency': root.style.setProperty('--icon-bg-opacity',(val/100).toFixed(2));break;
    case 'iconHoverEffect': root.dataset.iconHover=val;break;
    case 'accent': {
      const r=parseInt(val.slice(1,3),16),g=parseInt(val.slice(3,5),16),b=parseInt(val.slice(5,7),16);
      animateToColour(r, g, b);
      document.querySelectorAll('.dock-dot.focused').forEach(d=>{ d.style.background=val;d.style.boxShadow=`0 0 6px rgba(${r},${g},${b},0.5)`; });break;
    }
    case 'glowIntensity': {
      const hex=S.accent||'#7B5CF0';
      const r=parseInt(hex.slice(1,3),16)||123,g=parseInt(hex.slice(3,5),16)||92,b=parseInt(hex.slice(5,7),16)||240;
      const a=((val/100)*.6).toFixed(2);
      root.style.setProperty('--ndz-accent-glow',`rgba(${r},${g},${b},${a})`);break;
    }
    case 'shadowSoftness': root.style.setProperty('--window-shadow-spread',`${Math.round((val/100)*20)}px`);break;
    case 'desktopAtmosphere': {
      const neb=document.getElementById('wp-nebula'),grain=document.getElementById('wp-grain');
      if(val==='none'){if(neb)neb.style.display='none';if(grain)grain.style.display='none';}
      else if(val==='nebula'){if(neb){neb.style.display='';neb.style.opacity='';}if(grain)grain.style.display='';}
      else{if(neb){neb.style.display='';neb.style.opacity='1';}if(grain){grain.style.display='';grain.style.opacity='.055';}}break;
    }
    case 'neonAccent': root.dataset.neonAccent=val?'on':'off';break;
    case 'animations': {
      let s=document.getElementById('ndz-no-anim');
      if(!val){ if(!s){s=document.createElement('style');s.id='ndz-no-anim';s.textContent='*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}';document.head.appendChild(s);} }
      else s?.remove();break;
    }
    case 'performanceMode': {
      const neb=document.getElementById('wp-nebula'),par=document.getElementById('wp-particles'),gn=document.getElementById('wp-grain');
      if(neb) neb.style.animationPlayState=val?'paused':'running';
      if(par) par.style.opacity=val?'0':'.7';
      if(gn) gn.style.display=val?'none':'';break;
    }
    case 'cinematicMode': {
      let el=document.getElementById('ndz-cinematic');
      if(val){
        if(!el){el=document.createElement('div');el.id='ndz-cinematic';el.style.cssText='position:fixed;inset:0;z-index:9998;pointer-events:none;box-shadow:inset 0 5vh 0 rgba(0,0,0,.95),inset 0 -5vh 0 rgba(0,0,0,.95)';document.body.appendChild(el);}
      } else el?.remove();break;
    }
    case 'cursorGlow': {
      let glow=document.getElementById('ndz-cursor-glow');
      if(val){
        if(!glow){const [_cr,_cg,_cb]=wpTheme.pr;glow=document.createElement('div');glow.id='ndz-cursor-glow';glow.style.cssText=`position:fixed;width:300px;height:300px;border-radius:50%;pointer-events:none;z-index:5;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(${_cr},${_cg},${_cb},0.08) 0%,transparent 70%);transition:left .1s,top .1s`;document.body.appendChild(glow);}
        const move=e=>{glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';};
        document.addEventListener('mousemove',move);glow._move=move;
      } else {
        if(glow){if(glow._move)document.removeEventListener('mousemove',glow._move);glow.remove();}
      }break;
    }
    case 'animationSpeed': {
      let s=document.getElementById('ndz-anim-speed');if(!s){s=document.createElement('style');s.id='ndz-anim-speed';document.head.appendChild(s);}
      const muls={slow:'1.6s',normal:null,fast:'.5s',instant:'.001s'};
      const m=muls[val];
      s.textContent=m?`*,*::before,*::after{animation-duration:${m}!important;transition-duration:${m}!important}`:'';break;
    }
    case 'scale': { const sc=val/100; document.body.style.transform = sc !== 1 ? `scale(${sc})` : ''; document.body.style.transformOrigin='top left'; document.body.style.width = sc !== 1 ? `${(100/sc).toFixed(2)}%` : ''; break; }
    case 'dockSize': buildDock();break;
    case 'iconSize': case 'iconSpacing': buildDesktopIcons();break;
    case 'reduceTransparency':
      document.querySelectorAll('.os-window,#topbar,#dock').forEach(el=>{
        el.style.backdropFilter=val?'none':'';
        el.style.webkitBackdropFilter=val?'none':'';
        el.style.background=val?'rgba(10,8,22,.98)':'';
      });break;
    case 'wpBlurLevel': {
      const p=document.getElementById('wp-vignette');
      document.getElementById('wallpaper').style.filter=val>0?`blur(${val*0.4}px)`:'';break;
    }
    case 'wpParallaxIntensity': S.parallaxIntensity=val;break;
    case 'wpParticleIntensity': {
      S.particleDensity=val;
      const par=document.getElementById('wp-particles');
      if(par) par.style.opacity=(val/100).toFixed(2);
      buildParticles();break;
    }
    case 'wpAmbientLight': {
      const amb=document.getElementById('wp-ambient');
      if(amb) amb.style.opacity=(val/100).toFixed(2);break;
    }
    case 'wpGlowAtmosphere': {
      const neb=document.getElementById('wp-nebula');
      if(neb) neb.style.opacity=(val/100).toFixed(2);break;
    }
    case 'wpCinematicDepth': {
      let vig=document.getElementById('wp-vignette');
      if(vig) vig.style.opacity=(0.4+val*0.006).toFixed(2);break;
    }
    case 'wpMotionIntensity': {
      const neb=document.getElementById('wp-nebula');
      if(neb){const dur=22-val*.14;neb.style.animationDuration=dur.toFixed(1)+'s';}break;
    }
    case 'launchMode': break; // handled at launch time
    case 'immersiveMode':
      if (val) applyImmersiveTint(wpTheme.pr[0], wpTheme.pr[1], wpTheme.pr[2]);
      else clearImmersiveTint();
      break;
  }
}

      version: 1,
      exportedAt: new Date().toISOString(),
      noir: noirData,
      flow: flowData,
      rift: todoData,
      board: boardData,
      scriptforge: sfData,
      settings: S,
      iconPositions: (()=>{ try{ return JSON.parse(localStorage.getItem('ndz-icon-pos')||'{}'); }catch{ return {}; } })(), // FIX: 14
    };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ndz-os-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('System', 'Backup exported successfully', 'linear-gradient(145deg,#374151,#6B7280)');
  });
  document.getElementById('s-import-btn')?.addEventListener('click', () => {
    document.getElementById('s-import-file')?.click();
  });
  document.getElementById('s-import-file')?.addEventListener('change', function() {
    const file = this.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.version || !data.noir) throw new Error('Invalid backup file');
        if (!confirm('This will overwrite all your current data. Are you sure?')) return;
        if (data.noir) { noirData = data.noir; saveNoir(); }
        if (data.flow) { flowData = data.flow; saveFlow(); }
        if (data.rift) { todoData = data.rift; saveTodo(); }
        if (data.board) { boardData = data.board; saveBoard(); }
        if (data.scriptforge) { Object.assign(sfData, data.scriptforge); saveSF(); }
        if (data.settings) { Object.assign(S, data.settings); saveSettings(); }
        if (data.iconPositions) localStorage.setItem('ndz-icon-pos', JSON.stringify(data.iconPositions));
        showToast('System', 'Backup restored successfully', 'linear-gradient(145deg,#374151,#6B7280)');
        windows.forEach(w => {
          const body = document.querySelector(`#${w.id} .wnd-body`);
          if (!body) return;
          if (w.appId === 'noir') renderNoirApp(body);
          else if (w.appId === 'flow') renderFlowApp(body);
          else if (w.appId === 'rift') renderTodoApp(body);
        });
        renderSettingsContent();
      } catch(e) {
        showToast('System', 'Invalid backup file', 'linear-gradient(145deg,#991b1b,#ef4444)');
      }
    };
    reader.readAsText(file);
    this.value = '';
  });
}

function bindSettingsEvents(content){
  // Toggles
  content.querySelectorAll('.sett-toggle').forEach(t=>{
    t.addEventListener('click',()=>{
      const val=t.dataset.on==='false';
      t.dataset.on=val;
      setSetting(t.dataset.key,val);
    });
  });
  // Sliders
  content.querySelectorAll('input[type=range]').forEach(sl=>{
    sl.addEventListener('input',()=>{
      const val=+sl.value;
      const vEl=sl.parentElement.querySelector('.sett-slider-val');
      if(vEl) vEl.textContent=val+(sl.dataset.unit||'');
      setSetting(sl.dataset.key,val);
    });
  });
  // Cards
  content.querySelectorAll('.sett-card').forEach(c=>{
    c.addEventListener('click',()=>{ setSetting(c.dataset.key,c.dataset.val); });
  });
  // Selects
  content.querySelectorAll('select.sett-select').forEach(sel=>{
    sel.addEventListener('change',()=>setSetting(sel.dataset.key,sel.value));
  });
  // Per-app mode selects
  content.querySelectorAll('[data-app-mode]').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const appId=sel.dataset.appMode;
      const modes=Object.assign({},S.appModes||{});
      const cur=modes[appId]||{};
      if(sel.value==='default') delete modes[appId];
      else modes[appId]=Object.assign({},cur,{mode:sel.value});
      setSetting('appModes',modes);
    });
  });
  // Launch mode cards
  content.querySelectorAll('[data-launch]').forEach(c=>{
    c.addEventListener('click',()=>setSetting('launchMode',c.dataset.launch));
  });
  // Accent swatches (legacy — kept for backward compat if any remain)
  content.querySelectorAll('.sett-accent-swatch:not([data-wp-accent])').forEach(s=>{
    s.addEventListener('click',()=>setSetting('accent',s.dataset.accent));
  });
  // Wallpaper-driven accent swatches
  content.querySelectorAll('[data-wp-accent]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.wpAccent;
      const t=WP_THEMES[id]||WP_THEMES.void;
      setSetting('wallpaper',id);
      applyWpTheme(t);
      animateToColour(t.pr[0],t.pr[1],t.pr[2]);
      renderSettingsContent();
    });
  });
  // Accent color picker
  const picker=content.querySelector('#accent-picker');
  if(picker) picker.addEventListener('input',e=>{ document.getElementById('accent-hex').textContent=e.target.value;setSetting('accent',e.target.value); });
  // Wallpaper library tabs
  content.querySelectorAll('[data-wptab]').forEach(tab=>{
    tab.addEventListener('click',()=>{ wpLibTab=tab.dataset.wptab; renderSettingsContent(); });
  });
  // Built-in wallpaper click
  content.querySelectorAll('[data-wp-builtin]').forEach(card=>{
    card.addEventListener('click',()=>{
      wpLibClearCustom();
      const _wt=WP_THEMES[card.dataset.wpBuiltin]||WP_THEMES.void;
      setSetting('wallpaper',card.dataset.wpBuiltin);
      applyWpTheme(_wt);
      animateToColour(_wt.pr[0],_wt.pr[1],_wt.pr[2]);
      showToast('Wallpaper','Wallpaper applied','linear-gradient(145deg,#7C3AED,#9B6DFF)');
    });
  });
  // Custom wallpaper click
  content.querySelectorAll('[data-wp-custom]').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.closest('[data-wp-fav],[data-wp-del],[data-wp-rename]')) return;
      wpLibApply(card.dataset.wpCustom);
    });
  });
  // Favorite
  content.querySelectorAll('[data-wp-fav]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();wpLibToggleFav(btn.dataset.wpFav);renderSettingsContent();});
  });
  // Delete
  content.querySelectorAll('[data-wp-del]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      if(confirm('Delete this wallpaper?')){ wpLibDelete(btn.dataset.wpDel); renderSettingsContent(); }
    });
  });
  // Rename
  content.querySelectorAll('[data-wp-rename]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const cur=wpLib.wallpapers.find(w=>w.id===btn.dataset.wpRename);
      const name=prompt('Rename wallpaper:',cur?.name||'');
      if(name&&name.trim()){ wpLibRename(btn.dataset.wpRename,name.trim()); renderSettingsContent(); }
    });
  });
  // Wallpaper upload zone
  const uploadZone=content.querySelector('#wp-upload-trigger');
  const fileInput=content.querySelector('#wp-file-hidden');
  if(uploadZone&&fileInput){
    uploadZone.addEventListener('click',()=>fileInput.click());
    fileInput.addEventListener('change',e=>{
      const file=e.target.files[0];if(!file)return;
      const name=file.name.replace(/\.[^.]+$/,'').slice(0,30);
      const reader=new FileReader();
      reader.onload=ev=>{
        wpLibAdd(name,ev.target.result,'image');
        wpLibTab='uploaded';
        renderSettingsContent();
        showToast('Wallpaper',`"${name}" added to library`,'linear-gradient(145deg,#7C3AED,#9B6DFF)');
      };
      reader.readAsDataURL(file);
    });
    // Drag-and-drop
    uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.style.borderColor='rgba(123,92,240,.7)';});
    uploadZone.addEventListener('dragleave',()=>{uploadZone.style.borderColor='';});
    uploadZone.addEventListener('drop',e=>{
      e.preventDefault();uploadZone.style.borderColor='';
      const file=e.dataTransfer.files[0];if(!file||!file.type.startsWith('image/'))return;
      const name=file.name.replace(/\.[^.]+$/,'').slice(0,30);
      const reader=new FileReader();
      reader.onload=ev=>{wpLibAdd(name,ev.target.result,'image');wpLibTab='uploaded';renderSettingsContent();};
      reader.readAsDataURL(file);
    });
  }
  // Sound tests
  content.querySelectorAll('[data-test]').forEach(btn=>{ btn.addEventListener('click',()=>playSound(btn.dataset.test)); });
  // Reset — FIX: 10 listener bound after innerHTML is set, calls applyEffect for all keys then re-renders
  const resetBtn=content.querySelector('#reset-btn');
  if(resetBtn){
    resetBtn.addEventListener('click',()=>{
      if(resetBtn._confirmed){
        Object.assign(S,DEFAULTS);saveSettings(); // FIX: 10
        Object.entries(S).forEach(([k,v])=>applyEffect(k,v)); // FIX: 10
        showToast('System','Settings reset to defaults','linear-gradient(145deg,#374151,#6B7280)');
        renderSettingsContent(); // FIX: 10
      } else {
        resetBtn._confirmed=true;resetBtn.textContent='Confirm Reset?';
        resetBtn.style.background='rgba(239,68,68,.3)';
        setTimeout(()=>{resetBtn._confirmed=false;resetBtn.textContent='Reset';resetBtn.style.background='';},3000);
      }
    });
  }
}

function bindNoirEvents(content){
  // Journal
  const newJ=content.querySelector('#new-journal');
  if(newJ) newJ.addEventListener('click',()=>{
    const n=new Date();noirData.journal.unshift({id:nuid(),date:n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),mood:'Focused',content:''});
    saveNoir();renderNoirSection();
  });
  content.querySelectorAll('[data-journal-mood]').forEach(sel=>{
    sel.addEventListener('change',()=>{noirData.journal[+sel.dataset.journalMood].mood=sel.value;saveNoir();});
  });
  content.querySelectorAll('[data-journal-text]').forEach(ta=>{
    ta.addEventListener('input',()=>{noirData.journal[+ta.dataset.journalText].content=ta.value;saveNoir();});
  });
  content.querySelectorAll('[data-del-journal]').forEach(btn=>{
    btn.addEventListener('click',()=>{noirData.journal.splice(+btn.dataset.delJournal,1);saveNoir();renderNoirSection();});
  });
  // Hooks
  const hi=content.querySelector('#hook-input');
  if(hi) hi.addEventListener('keydown',e=>{if(e.key==='Enter'&&hi.value.trim()){noirData.hooks.push({id:nuid(),text:hi.value.trim()});saveNoir();renderNoirSection();}});
  content.querySelectorAll('[data-copy-hook]').forEach(el=>{
    el.addEventListener('click',()=>navigator.clipboard.writeText(noirData.hooks[+el.dataset.copyHook].text).catch(()=>{}));
  });
  content.querySelectorAll('[data-del-hook]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();noirData.hooks.splice(+btn.dataset.delHook,1);saveNoir();renderNoirSection();});
  });
  // Ideas
  const ii=content.querySelector('#idea-input');
  if(ii) ii.addEventListener('keydown',e=>{if(e.key==='Enter'&&ii.value.trim()){noirData.ideas.push({id:nuid(),text:ii.value.trim(),pinned:false});saveNoir();renderNoirSection();}});
  content.querySelectorAll('[data-pin-idea]').forEach(btn=>{
    btn.addEventListener('click',()=>{noirData.ideas[+btn.dataset.pinIdea].pinned=!noirData.ideas[+btn.dataset.pinIdea].pinned;saveNoir();renderNoirSection();});
  });
  content.querySelectorAll('[data-del-idea]').forEach(btn=>{
    btn.addEventListener('click',()=>{noirData.ideas.splice(+btn.dataset.delIdea,1);saveNoir();renderNoirSection();});
  });
  // Plans
  const ap=content.querySelector('#add-plan');
  if(ap) ap.addEventListener('click',()=>{
    const t=content.querySelector('#plan-title-inp'),p=content.querySelector('#plan-plat-inp');
    if(!t?.value.trim()) return;
    noirData.plans.push({id:nuid(),title:t.value.trim(),platform:p?.value||'YouTube',status:'Idea'});
    t.value='';saveNoir();renderNoirSection();
  });
  content.querySelectorAll('[data-cycle-plan]').forEach(el=>{
    el.addEventListener('click',()=>{const p=noirData.plans[+el.dataset.cyclePlan];p.status=STATUS_CYCLE[(STATUS_CYCLE.indexOf(p.status)+1)%STATUS_CYCLE.length];saveNoir();renderNoirSection();});
  });
  content.querySelectorAll('[data-del-plan]').forEach(btn=>{
    btn.addEventListener('click',()=>{noirData.plans.splice(+btn.dataset.delPlan,1);saveNoir();renderNoirSection();});
  });
  content.querySelectorAll('[data-flow-send]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const p=noirData.plans[+btn.dataset.flowSend]; if(!p) return;
      flowSendFromNoir(p);
    });
  });
  // Goals
  const ag=content.querySelector('#add-goal');
  if(ag) ag.addEventListener('click',()=>{
    const gi=content.querySelector('#goal-input');if(!gi?.value.trim()) return;
    noirData.goals.push({id:nuid(),text:gi.value.trim(),progress:0,done:false});gi.value='';saveNoir();renderNoirSection();
  });
  content.querySelectorAll('[data-toggle-goal]').forEach(el=>{
    el.addEventListener('click',()=>{const g=noirData.goals[+el.dataset.toggleGoal];g.done=!g.done;if(g.done)g.progress=100;saveNoir();renderNoirSection();});
  });
  content.querySelectorAll('[data-goal-prog]').forEach(sl=>{
    sl.addEventListener('input',()=>{noirData.goals[+sl.dataset.goalProg].progress=+sl.value;saveNoir();renderNoirSection();});
  });
  content.querySelectorAll('[data-del-goal]').forEach(btn=>{
    btn.addEventListener('click',()=>{noirData.goals.splice(+btn.dataset.delGoal,1);saveNoir();renderNoirSection();});
  });
  content.querySelectorAll('[data-link-tasks]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();noirShowLinkTasksPicker(+btn.dataset.linkTasks,btn);});
  });
  // Brain dump
  const bd=content.querySelector('#brain-dump');
  if(bd) bd.addEventListener('input',()=>{noirData.dump=bd.value;saveNoir();});
  // Scripts
  const as2=content.querySelector('#add-script');
  if(as2) as2.addEventListener('click',()=>{
    const t=content.querySelector('#script-title-inp'),p=content.querySelector('#script-plat-inp');
    if(!t?.value.trim()) return;
    noirData.scripts.push({id:nuid(),title:t.value.trim(),platform:p?.value||'YouTube',content:''});
    t.value='';saveNoir();renderNoirSection();
  });
  content.querySelectorAll('[data-script-content]').forEach(ta=>{
    ta.addEventListener('input',()=>{noirData.scripts[+ta.dataset.scriptContent].content=ta.value;saveNoir();});
  });
  content.querySelectorAll('[data-del-script]').forEach(btn=>{
    btn.addEventListener('click',()=>{noirData.scripts.splice(+btn.dataset.delScript,1);saveNoir();renderNoirSection();});
  });
  // Script → PULSE sprint
  content.querySelectorAll('[data-script-pulse]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const s=noirData.scripts[+btn.dataset.scriptPulse]; if(!s) return;
      pulseState.activeTask={id:'script-'+btn.dataset.scriptPulse,text:s.title};
      pulseState.mode='focus';
      pulseState.secondsLeft=(pulseData.focusDuration||25)*60;
      pulseState.running=false;
      const pw=windows.find(w=>w.appId==='pulse');
      if(pw){const pb=document.querySelector(`#win-${pw.id} .wnd-body`);if(pb)renderPulseApp(pb);setFocusedApp('pulse');}
      else launchApp('pulse');
      showToast('PULSE',`Writing sprint · "${s.title.slice(0,28)}"`,`linear-gradient(145deg,#1a1030,#7B5CF0)`);
    });
  });
  // Idea → FLOW
  content.querySelectorAll('[data-idea-flow]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const idea=noirData.ideas[+btn.dataset.ideaFlow]; if(!idea) return;
      noirSendToFlow(idea.text,'Idea');
    });
  });
  // Hook → FLOW
  content.querySelectorAll('[data-hook-flow]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const h=noirData.hooks[+btn.dataset.hookFlow]; if(!h) return;
      noirSendToFlow(h.text,'Hook');
    });
  });
}

/* ════════ TRASH APP ════════ */

/* ════════ WEB AUDIO SOUND ENGINE ════════ */
let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx||_audioCtx.state==='closed') _audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==='suspended') _audioCtx.resume();
  return _audioCtx;
}
const SOUND_PROFILES={
  minimal:{appOpen:{type:'sine',freqs:[440,660],dur:.18},dockHover:{type:'sine',freqs:[880],dur:.06},windowOpen:{type:'sine',freqs:[330,440],dur:.14},startup:{type:'sine',freqs:[220,330,440,550],dur:.5}},
  glass:{appOpen:{type:'triangle',freqs:[880,1100],dur:.22},dockHover:{type:'triangle',freqs:[1320],dur:.08},windowOpen:{type:'triangle',freqs:[660,880],dur:.18},startup:{type:'triangle',freqs:[440,660,880,1100],dur:.6}},
  scifi:{appOpen:{type:'sawtooth',freqs:[220,440],dur:.25},dockHover:{type:'sawtooth',freqs:[660],dur:.07},windowOpen:{type:'sawtooth',freqs:[180,360],dur:.2},startup:{type:'sawtooth',freqs:[110,220,330,440],dur:.7}},
  retro:{appOpen:{type:'square',freqs:[440,550],dur:.15},dockHover:{type:'square',freqs:[660],dur:.05},windowOpen:{type:'square',freqs:[330,440],dur:.12},startup:{type:'square',freqs:[262,330,392,523],dur:.45}},
};
function playSound(type){
  const pack=S.soundPack,vol=S.masterVolume/100;
  if(pack==='silent'||vol===0) return;
  try{
    const ctx=getAudioCtx();
    const gain=ctx.createGain();gain.gain.value=vol*.3;gain.connect(ctx.destination);
    const profile=(SOUND_PROFILES[pack]||SOUND_PROFILES.glass)[type];
    if(!profile) return;
    profile.freqs.forEach((freq,i)=>{
      const osc=ctx.createOscillator();osc.type=profile.type;osc.frequency.value=freq;
      const env=ctx.createGain();
      env.gain.setValueAtTime(0,ctx.currentTime+i*profile.dur*.4);
      env.gain.linearRampToValueAtTime(1,ctx.currentTime+i*profile.dur*.4+.01);
      env.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*profile.dur*.4+profile.dur);
      osc.connect(env);env.connect(gain);
      osc.start(ctx.currentTime+i*profile.dur*.4);
      osc.stop(ctx.currentTime+i*profile.dur*.4+profile.dur+.01);
    });
  }catch(e){}
}

const FLOW_KEY='ndz-flow-v1';
const FLOW_TAGS={
  Idea:    {bg:'rgba(123,92,240,0.22)', fg:'#c4b0ff'},
  Script:  {bg:'rgba(245,158,11,0.20)', fg:'#fcd58a'},
  Video:   {bg:'rgba(239,68,68,0.20)',  fg:'#ffb4b4'},
  Design:  {bg:'rgba(59,130,246,0.20)', fg:'#a8c7ff'},
  Admin:   {bg:'rgba(148,163,184,0.20)',fg:'#cbd5e1'},
  Personal:{bg:'rgba(16,185,129,0.20)', fg:'#86efac'},
};
const FLOW_TAG_NAMES=Object.keys(FLOW_TAGS);
const FLOW_PRIOS=['urgent','normal','low'];
const FLOW_PLATFORM_TAG={YouTube:'Video',TikTok:'Video',Instagram:'Video',Twitter:'Script',LinkedIn:'Script',Newsletter:'Script'};

function flowDefaults(){
  return { columns:[
    {id:'col-'+nuid(), title:'Backlog',     cards:[]},
    {id:'col-'+nuid(), title:'This Week',   cards:[]},
    {id:'col-'+nuid(), title:'In Progress', cards:[]},
    {id:'col-'+nuid(), title:'Done',        cards:[]},
  ]};
}
let flowData=flowDefaults();
try{
  const raw=localStorage.getItem(FLOW_KEY);
  if(raw){ const parsed=JSON.parse(raw); if(parsed&&Array.isArray(parsed.columns)) flowData=parsed; }
}catch(e){}
function saveFlow(){ try{localStorage.setItem(FLOW_KEY,JSON.stringify(flowData));}catch(e){} }

let flowDrag=null;          // {cardId, fromCol}
let flowAddingCol=null;     // colId being edited inline (add card)
let flowEditingTitle=null;  // cardId currently inline-editing title
let flowRoot=null;

function flowEnsureInit(){ if(!flowData.columns||!flowData.columns.length){ flowData=flowDefaults(); saveFlow(); } }
function flowFindCol(id){ return flowData.columns.find(c=>c.id===id); }
function flowFindCard(cardId){ for(const col of flowData.columns){ const c=col.cards.find(c=>c.id===cardId); if(c) return {col,card:c}; } return null; }

function flowSendFromNoir(plan){
  flowEnsureInit();
  const matched=flowData.columns.find(c=>c.title.toLowerCase()==='backlog');
  const backlog=matched||flowData.columns[0];
  const tag=FLOW_PLATFORM_TAG[plan.platform]||'Idea';
  backlog.cards.unshift({id:'card-'+nuid(), title:plan.title, tag, priority:'normal', note:plan.platform||null, createdAt:Date.now()});
  saveFlow();
  if(flowRoot) renderFlowApp(flowRoot.closest('.wnd-body')||flowRoot.parentElement);
  const msg = matched ? `Sent to "${backlog.title}"` : `No "Backlog" column — sent to "${backlog.title}" (fallback)`;
  showToast('FLOW', msg, 'linear-gradient(145deg,#7C3AED,#9B6DFF)');
}

function flowEsc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function flowCardHtml(card){
  const tag=card.tag&&FLOW_TAGS[card.tag];
  const tagHtml=tag?`<span class="flow-tag" style="background:${tag.bg};color:${tag.fg}">${flowEsc(card.tag)}</span>`:'';
  const prio=card.priority?`<span class="flow-prio ${card.priority} flow-card-corner-prio"></span>`:'';
  const note=card.note?`<div class="flow-card-note">${flowEsc(card.note)}</div>`:'';
  const meta=(card.tag)?`<div class="flow-card-meta">${tagHtml}</div>`:'';
  return `<div class="flow-card" draggable="true" data-card-id="${card.id}" style="padding-bottom:${(note||meta)?'28px':'22px'}">
    ${prio}
    <button class="flow-card-menu-btn" data-card-menu="${card.id}" title="Options">···</button>
    <div class="flow-card-top">
      <div class="flow-card-title" data-card-title="${card.id}">${flowEsc(card.title)}</div>
    </div>
    ${note}
    ${meta}
    <button class="flow-pulse-btn" data-flow-pulse="${card.id}" title="Focus with PULSE">▶ Focus</button>
  </div>`;
}

function flowAddFormHtml(colId, draft){
  const d=draft||{title:'',tag:null,priority:null,note:''};
  return `<div class="flow-add-form" data-add-form="${colId}">
    <input data-f="title" placeholder="Card title…" value="${flowEsc(d.title)}" autofocus>
    <input data-f="note" placeholder="Add a note…" value="${flowEsc(d.note||'')}" maxlength="80">
    <div class="flow-pill-row">
      ${FLOW_TAG_NAMES.map(t=>`<span class="flow-mini-pill${d.tag===t?' on':''}" data-f-tag="${t}">${t}</span>`).join('')}
    </div>
    <div class="flow-form-row">
      <div class="flow-pill-row" style="gap:8px">
        ${FLOW_PRIOS.map(p=>`<span class="flow-mini-dot ${p}${d.priority===p?' on':''}" data-f-prio="${p}" title="${p}" style="background:${p==='urgent'?'#EF4444':p==='normal'?'#F59E0B':'#10B981'}"></span>`).join('')}
      </div>
      <div style="display:flex;gap:6px">
        <button class="flow-form-btn ghost" data-f-cancel>Cancel</button>
        <button class="flow-form-btn" data-f-save>✓ Add</button>
      </div>
    </div>

}

function flowColHtml(col){
  const isAdding=flowAddingCol===col.id;
  const cards=col.cards.length
    ? col.cards.map(flowCardHtml).join('')
    : `<div class="flow-empty">Drop here</div>`;
  return `<div class="flow-col" data-col-id="${col.id}">
    <div class="flow-col-head">
      <div class="flow-col-pill">
        <input class="flow-col-name" data-col-name="${col.id}" value="${flowEsc(col.title)}" spellcheck="false">
        <span class="flow-col-count">${col.cards.length}</span>
      </div>
      <button class="flow-col-menu" data-col-menu="${col.id}" title="Options">···</button>
    </div>
    <div class="flow-col-body" data-col-body="${col.id}">${cards}</div>
    ${isAdding ? flowAddFormHtml(col.id) : `<button class="flow-add-btn" data-add-card="${col.id}">+ Add card</button>`}
  </div>`;

function renderFlowApp(body){
  flowEnsureInit();
  const total=flowData.columns.reduce((s,c)=>s+c.cards.length,0);
  body.innerHTML=`<div class="flow-wrap">
    <div class="flow-head">
      <div class="flow-title">FLOW</div>
      <div class="flow-sub">${flowData.columns.length} columns · ${total} cards</div>
    </div>
    <div class="flow-board" data-flow-board>
      ${flowData.columns.map(flowColHtml).join('')}
      <button class="flow-add-col" data-add-col title="Add column">+</button>
    </div>
  </div>`;
  flowRoot=body.querySelector('.flow-wrap');
  flowBindEvents(body);
}

function flowBindEvents(body){
  const board=body.querySelector('[data-flow-board]');

  // Add column
  body.querySelector('[data-add-col]')?.addEventListener('click',()=>{
    const id='col-'+nuid();
    flowData.columns.push({id,title:'New column',cards:[]});
    saveFlow(); renderFlowApp(body);
    setTimeout(()=>{ const el=body.querySelector(`[data-col-name="${id}"]`); if(el){el.focus();el.select();} },20);
  });

  // Column name edit
  body.querySelectorAll('[data-col-name]').forEach(inp=>{
    const commit=()=>{ const col=flowFindCol(inp.dataset.colName); if(col){ col.title=inp.value.trim()||col.title; saveFlow(); inp.value=col.title; } };
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){inp.blur();} });
  });

  // Column menu
  body.querySelectorAll('[data-col-menu]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      flowOpenColMenu(btn, btn.dataset.colMenu, body);
    });
  });

  // Add card button
  body.querySelectorAll('[data-add-card]').forEach(btn=>{
    btn.addEventListener('click',()=>{ flowAddingCol=btn.dataset.addCard; renderFlowApp(body); });
  });

  // Add form interactions (delegated per form)
  body.querySelectorAll('[data-add-form]').forEach(form=>{
    const colId=form.dataset.addForm;
    const titleInp=form.querySelector('[data-f="title"]');
    const noteInp=form.querySelector('[data-f="note"]');
    if(titleInp) setTimeout(()=>titleInp.focus(),10);
    let draft={title:'',tag:null,priority:null,note:''};
    form.querySelectorAll('[data-f-tag]').forEach(pill=>{
      pill.addEventListener('click',()=>{
        draft.tag = draft.tag===pill.dataset.fTag?null:pill.dataset.fTag;
        form.querySelectorAll('[data-f-tag]').forEach(p=>p.classList.toggle('on',p.dataset.fTag===draft.tag));
      });
    });
    form.querySelectorAll('[data-f-prio]').forEach(d=>{
      d.addEventListener('click',()=>{
        draft.priority = draft.priority===d.dataset.fPrio?null:d.dataset.fPrio;
        form.querySelectorAll('[data-f-prio]').forEach(x=>x.classList.toggle('on',x.dataset.fPrio===draft.priority));
      });
    });
    const cancel=()=>{ flowAddingCol=null; renderFlowApp(body); };
    const save=()=>{
      const title=titleInp.value.trim(); if(!title){ titleInp.focus(); return; }
      draft.title=title; draft.note=noteInp.value.trim()||null;
      const col=flowFindCol(colId); if(!col) return;
      col.cards.push({id:'card-'+nuid(),title:draft.title,tag:draft.tag,priority:draft.priority,note:draft.note,createdAt:Date.now()});
      flowAddingCol=null; saveFlow(); renderFlowApp(body);
    };
    form.querySelector('[data-f-save]').addEventListener('click',save);
    form.querySelector('[data-f-cancel]').addEventListener('click',cancel);
    [titleInp,noteInp].forEach(i=>i&&i.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();save();}
      if(e.key==='Escape'){e.preventDefault();cancel();}
    }));
  });

  // Card: inline title edit
  body.querySelectorAll('[data-card-title]').forEach(el=>{
    el.addEventListener('dblclick',()=>{
      el.contentEditable='true'; el.focus();
      const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    el.addEventListener('blur',()=>{
      el.contentEditable='false';
      const found=flowFindCard(el.dataset.cardTitle); if(found){ const t=el.textContent.trim(); if(t){ found.card.title=t; saveFlow(); } else { el.textContent=found.card.title; } }
    });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();el.blur();} if(e.key==='Escape'){el.textContent=flowFindCard(el.dataset.cardTitle)?.card.title||'';el.blur();} });
  });

  // Card menu
  body.querySelectorAll('[data-card-menu]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      flowOpenCardMenu(btn, btn.dataset.cardMenu, body);
    });
  });

  // Card: focus with PULSE
  body.querySelectorAll('[data-flow-pulse]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const found = flowFindCard(btn.dataset.flowPulse);
      if (!found) return;
      pulseState.activeTask = { id: btn.dataset.flowPulse, text: found.card.title };
      pulseState.mode = 'focus';
      pulseState.secondsLeft = (pulseData.focusDuration||25) * 60;
      pulseState.running = false;
      const pulseWin = windows.find(w => w.appId === 'pulse');
      if (pulseWin) { const pb = document.querySelector(`#win-${pulseWin.id} .wnd-body`); if (pb) renderPulseApp(pb); setFocusedApp('pulse'); }
      else launchApp('pulse');
      showToast('PULSE', `"${found.card.title.slice(0,32)}" loaded`, 'linear-gradient(145deg,#1a1030,#7B5CF0)');
    });
  });

  // Drag and drop
  body.querySelectorAll('.flow-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      const id=card.dataset.cardId;
      const found=flowFindCard(id); if(!found) return;
      flowDrag={cardId:id, fromCol:found.col.id};
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain',id);}catch(_){}
      setTimeout(()=>card.classList.add('dragging'),0);
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      flowClearDragVisuals(body);
      flowDrag=null;
    });
  });

  body.querySelectorAll('.flow-col').forEach(col=>{
    const colId=col.dataset.colId;
    const bodyEl=col.querySelector('[data-col-body]');
    col.addEventListener('dragover',e=>{
      if(!flowDrag) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      col.classList.add('drag-over');
      flowShowInsertLine(bodyEl, e.clientY);
    });
    col.addEventListener('dragleave',e=>{
      if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop',e=>{
      e.preventDefault();
      if(!flowDrag) return;
      const targetIndex=flowComputeInsertIndex(bodyEl, e.clientY);
      flowMoveCard(flowDrag.cardId, flowDrag.fromCol, colId, targetIndex);
      flowDrag=null;
      saveFlow(); renderFlowApp(body);
    });
  });
}

function flowClearDragVisuals(body){
  body.querySelectorAll('.flow-col').forEach(c=>c.classList.remove('drag-over'));
  body.querySelectorAll('.flow-insert').forEach(i=>i.remove());
}

function flowShowInsertLine(bodyEl, clientY){
  bodyEl.querySelectorAll('.flow-insert').forEach(i=>i.remove());
  const cards=[...bodyEl.querySelectorAll('.flow-card:not(.dragging)')];
  const line=document.createElement('div'); line.className='flow-insert';
  let inserted=false;
  for(const c of cards){
    const r=c.getBoundingClientRect();
    if(clientY < r.top + r.height/2){ bodyEl.insertBefore(line,c); inserted=true; break; }
  }
  if(!inserted) bodyEl.appendChild(line);
}

function flowComputeInsertIndex(bodyEl, clientY){
  const cards=[...bodyEl.querySelectorAll('.flow-card:not(.dragging)')];
  for(let i=0;i<cards.length;i++){
    const r=cards[i].getBoundingClientRect();
    if(clientY < r.top + r.height/2) return i;
  }
  return cards.length;
}

function flowMoveCard(cardId, fromColId, toColId, toIndex){
  const from=flowFindCol(fromColId), to=flowFindCol(toColId);
  if(!from||!to) return;
  const idx=from.cards.findIndex(c=>c.id===cardId); if(idx<0) return;
  const [card]=from.cards.splice(idx,1);
  if(from===to && idx<toIndex) toIndex--;
  to.cards.splice(Math.max(0,Math.min(toIndex,to.cards.length)),0,card);
}

function flowOpenColMenu(anchor, colId, body){
  flowCloseMenus();
  const col=flowFindCol(colId); if(!col) return;
  const m=document.createElement('div'); m.className='flow-popmenu';
  m.innerHTML=`
    <button data-act="rename">Rename</button>
    <button data-act="clear">Clear done cards</button>
    <div class="sep"></div>
    <button data-act="delete" style="color:#ff8a8a">Delete column</button>`;
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();
  m.style.left=Math.min(window.innerWidth-160,r.right-140)+'px';
  m.style.top=(r.bottom+4)+'px';
  m.querySelector('[data-act="rename"]').onclick=()=>{ flowCloseMenus(); const inp=body.querySelector(`[data-col-name="${colId}"]`); if(inp){inp.focus();inp.select();} };
  m.querySelector('[data-act="clear"]').onclick=()=>{ flowCloseMenus(); col.cards=[]; saveFlow(); renderFlowApp(body); };
  m.querySelector('[data-act="delete"]').onclick=()=>{
    flowCloseMenus();
    if(col.cards.length && !confirm(`Delete "${col.title}" and ${col.cards.length} card(s)?`)) return;
    flowData.columns=flowData.columns.filter(c=>c.id!==colId);
    if(!flowData.columns.length) flowData=flowDefaults();
    saveFlow(); renderFlowApp(body);
  };
  setTimeout(()=>document.addEventListener('mousedown',flowOutsideClose,{once:true}),0);
}

function flowOpenCardMenu(anchor, cardId, body){
  flowCloseMenus();
  const found=flowFindCard(cardId); if(!found) return;
  const {col,card}=found;
  const otherCols=flowData.columns.filter(c=>c.id!==col.id);
  const m=document.createElement('div'); m.className='flow-popmenu';
  m.innerHTML=`
    <button data-act="edit">Edit title</button>
    ${otherCols.length?`<div class="sep"></div>${otherCols.map(c=>`<button data-move="${c.id}">Move to → ${flowEsc(c.title)}</button>`).join('')}`:''}
    <div class="sep"></div>
    <button data-act="dup">Duplicate</button>
    <button data-act="delete" style="color:#ff8a8a">Delete</button>`;
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();
  m.style.left=Math.min(window.innerWidth-160,r.right-140)+'px';
  m.style.top=(r.bottom+4)+'px';
  m.querySelector('[data-act="edit"]').onclick=()=>{ flowCloseMenus(); const el=body.querySelector(`[data-card-title="${cardId}"]`); if(el){ el.dispatchEvent(new MouseEvent('dblclick')); } };
  m.querySelector('[data-act="dup"]').onclick=()=>{
    flowCloseMenus();
    const idx=col.cards.findIndex(c=>c.id===cardId);
    col.cards.splice(idx+1,0,{...card,id:'card-'+nuid(),createdAt:Date.now()});
    saveFlow(); renderFlowApp(body);
  };
  m.querySelector('[data-act="delete"]').onclick=()=>{
    flowCloseMenus();
    col.cards=col.cards.filter(c=>c.id!==cardId);
    saveFlow(); renderFlowApp(body);
  };
  m.querySelectorAll('[data-move]').forEach(b=>{
    b.onclick=()=>{ flowCloseMenus(); flowMoveCard(cardId, col.id, b.dataset.move, flowFindCol(b.dataset.move).cards.length); saveFlow(); renderFlowApp(body); };
  });
  setTimeout(()=>document.addEventListener('mousedown',flowOutsideClose,{once:true}),0);
}

function flowCloseMenus(){ document.querySelectorAll('.flow-popmenu').forEach(m=>m.remove()); }
function flowOutsideClose(e){ if(!e.target.closest('.flow-popmenu')) flowCloseMenus(); }

    if (!boardData.boards.length) {
      const id = nuid();
      boardData.boards.push({ id, name:'My Board', nodes:[], pan:{x:0,y:0}, zoom:1 });
      boardData.activeBoardId = id; saveBoard();
    }
    if (!boardData.activeBoardId) boardData.activeBoardId = boardData.boards[0].id;
  } catch(e) {
    const id = nuid();
    boardData = { boards:[{ id, name:'My Board', nodes:[], pan:{x:0,y:0}, zoom:1 }], activeBoardId:id };
  }
}
function saveBoard() { try { localStorage.setItem(BOARD_KEY, JSON.stringify(boardData)); } catch(e) {} }
function boardGetActive() { return boardData.boards.find(b => b.id === boardData.activeBoardId); }
function boardApplyTransform() {
  const inner = document.getElementById('board-canvas-inner');
  if (inner) inner.style.transform = `translate(${boardState.panX}px,${boardState.panY}px) scale(${boardState.zoom})`;
}
function boardRestoreView() {
  const b = boardGetActive();
  if (b) { boardState.zoom = b.zoom||1; boardState.panX = b.pan?.x||0; boardState.panY = b.pan?.y||0; }
  boardApplyTransform();
}
function boardSaveView() {
  const b = boardGetActive();
  if (b) { b.zoom = boardState.zoom; b.pan = { x:boardState.panX, y:boardState.panY }; saveBoard(); }
}
function boardUpdateZoomDisplay() {
  const el = document.querySelector('.board-zoom-display');
  if (el) el.textContent = Math.round(boardState.zoom * 100) + '%';
}
function boardFitToScreen() {
  const b = boardGetActive();
  if (!b || !b.nodes.length) { boardState = { zoom:1, panX:0, panY:0 }; boardApplyTransform(); return; }
  const minX = Math.min(...b.nodes.map(n=>n.x));
  const minY = Math.min(...b.nodes.map(n=>n.y));
  const maxX = Math.max(...b.nodes.map(n=>n.x+(n.w||200)));
  const maxY = Math.max(...b.nodes.map(n=>n.y+(n.h||150)));
  const canvas = document.getElementById('board-canvas');
  if (!canvas) return;
  const scaleX = canvas.offsetWidth / (maxX-minX+80);
  const scaleY = canvas.offsetHeight / (maxY-minY+80);
  boardState.zoom = Math.min(1, Math.min(scaleX, scaleY));
  boardState.panX = -minX*boardState.zoom+40;
  boardState.panY = -minY*boardState.zoom+40;
  boardApplyTransform(); boardSaveView(); boardUpdateZoomDisplay();
}
function boardUpdateToolbar() {
  document.querySelectorAll('.board-tool-btn[data-tool]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === boardActiveTool);
  });
}
function boardUpdateEmptyState() {
  const b = boardGetActive();
  const empty = document.querySelector('.board-empty');
  if (empty) empty.style.display = b && b.nodes.length ? 'none' : 'flex';
}
function boardEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function boardNodeInnerHTML(node) {
  const resize = `<div class="board-node-resize" data-resize="${node.id}"></div>`;
  if (node.type === 'sticky') {
    return `<div class="board-sticky-colors">${Object.keys(BOARD_STICKY_COLORS).map(col=>`<div class="board-sticky-color-dot${node.data.color===col?' active':''}" style="background:${BOARD_STICKY_COLORS[col].border}" data-sticky-color="${col}" data-for="${node.id}"></div>`).join('')}</div>
    <textarea class="board-sticky-textarea" data-sticky-text="${node.id}" placeholder="Write something…">${boardEsc(node.data.text)}</textarea>${resize}`;
  }
  if (node.type === 'text') {
    return `<div class="board-text-content" contenteditable="true" data-text-node="${node.id}" style="font-size:${node.data.fontSize||14}px;font-weight:${node.data.fontWeight||'400'};color:${node.data.color||'rgba(255,255,255,0.9)'};text-align:${node.data.align||'left'}">${boardEsc(node.data.content)}</div>${resize}`;
  }
  if (node.type === 'image') {
    return `<img src="${boardEsc(node.data.src)}" style="width:100%;height:${node.h?'calc(100% - '+(node.data.caption?'28px':'4px')+')':'200px'};object-fit:${node.data.objectFit||'cover'};border-radius:${node.data.borderRadius||10}px;display:block"/>${node.data.caption?`<div class="board-image-caption">${boardEsc(node.data.caption)}</div>`:''}${resize}`;
  }
  if (node.type === 'shape') {
    const sh = node.data.shape||'rect', f = node.data.fill||'rgba(123,92,240,0.2)', st = node.data.stroke||'rgba(123,92,240,0.7)', sw = node.data.strokeWidth||1.5;
    let svg = '';
    if (sh==='rect') svg=`<rect x="2" y="2" width="96%" height="96%" rx="6" fill="${f}" stroke="${st}" stroke-width="${sw}"/>`;
    else if (sh==='circle') svg=`<ellipse cx="50%" cy="50%" rx="48%" ry="48%" fill="${f}" stroke="${st}" stroke-width="${sw}"/>`;
    else if (sh==='triangle') svg=`<polygon points="50,4 98,96 2,96" fill="${f}" stroke="${st}" stroke-width="${sw}"/>`;
    else if (sh==='line') svg=`<line x1="4" y1="50%" x2="96%" y2="50%" stroke="${st}" stroke-width="${sw}" stroke-linecap="round"/>`;
    return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;opacity:${node.data.opacity||1}">${svg}</svg>${resize}`;
  }
  if (node.type === 'link') {
    return `<div style="width:16px;height:16px;flex-shrink:0;font-size:13px;line-height:1">🔗</div><div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${boardEsc(node.data.title||node.data.url)}</div><div style="font-size:10px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${boardEsc(node.data.url)}</div></div>`;
  }
  if (node.type === 'noir-idea') {
    return `<div class="board-noir-badge">NOIR · Idea</div><div class="board-noir-text">${boardEsc(node.data.text)}</div><div class="board-noir-link" data-open-noir="1">Open in NOIR →</div>${resize}`;
  }
  if (node.type === 'flow-card') {
    return `<div class="board-flow-badge">FLOW · ${boardEsc(node.data.colName)}</div><div class="board-flow-title">${boardEsc(node.data.title)}</div><div class="board-flow-meta">${node.data.tag?`<span style="font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,0.08);color:var(--t2)">${boardEsc(node.data.tag)}</span>`:''}</div><div class="board-noir-link" data-open-flow="1">Open in FLOW →</div>${resize}`;
  }
  if (node.type === 'rift-task') {
    return `<div class="board-rift-check${node.data.done?' done':''}" data-rift-toggle="${node.data.taskId}"></div><div class="board-rift-text${node.data.done?' done':''}">${boardEsc(node.data.text)}</div><div style="font-size:10px;color:var(--t3);margin-left:auto;cursor:pointer;flex-shrink:0" data-open-rift="1">RIFT →</div>`;
  }
  if (node.type === 'embed') {
    return `<iframe src="${boardEsc(node.data.url)}" style="width:100%;height:100%;border:none;border-radius:8px" sandbox="allow-scripts allow-same-origin"></iframe>${resize}`;
  }
  return `<div style="color:var(--t3);font-size:12px;padding:8px">Node: ${boardEsc(node.type)}</div>`;
}

function boardRenderNode(node) {
  const el = document.createElement('div');
  el.className = `board-node board-node-${node.type}`;
  el.dataset.nodeId = node.id;
  el.style.cssText = `position:absolute;left:${node.x}px;top:${node.y}px;width:${node.w}px;${node.h?`height:${node.h}px;`:'min-height:40px;'}z-index:${node.z||1};${node.locked?'pointer-events:none;opacity:0.7;':''}`;
  if (node.type === 'sticky') {
    const c = BOARD_STICKY_COLORS[node.data.color] || BOARD_STICKY_COLORS.yellow;
    el.style.cssText += `background:${c.bg};border:1px solid ${c.border};color:${c.text};border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;`;
  }
  el.innerHTML = boardNodeInnerHTML(node);
  return el;
}

function boardRenderAllNodes() {
  const inner = document.getElementById('board-canvas-inner');
  if (!inner) return;
  inner.innerHTML = '';
  const b = boardGetActive();
  if (!b) return;
  b.nodes.forEach(node => inner.appendChild(boardRenderNode(node)));
  boardBindNodeEvents(inner, b);
  boardUpdateEmptyState();
}

function boardBindNodeEvents(inner, board) {
  inner.querySelectorAll('[data-sticky-text]').forEach(ta => {
    ta.addEventListener('input', () => { const n=board.nodes.find(n=>n.id===ta.dataset.stickyText); if(n){n.data.text=ta.value;saveBoard();} });
    ta.addEventListener('mousedown', e => e.stopPropagation());
  });
  inner.querySelectorAll('[data-sticky-color]').forEach(dot => {
    dot.addEventListener('click', e => {
      e.stopPropagation();
      const n = board.nodes.find(n=>n.id===dot.dataset.for); if(!n) return;
      n.data.color = dot.dataset.stickyColor; saveBoard();
      const el = inner.querySelector(`[data-node-id="${n.id}"]`);
      if (el) {
        const c = BOARD_STICKY_COLORS[n.data.color]||BOARD_STICKY_COLORS.yellow;
        el.style.background=c.bg; el.style.borderColor=c.border; el.style.color=c.text;
        el.querySelectorAll('.board-sticky-color-dot').forEach(d=>d.classList.toggle('active',d.dataset.stickyColor===n.data.color));
      }
    });
  });
  inner.querySelectorAll('[data-text-node]').forEach(el => {
    el.addEventListener('input', () => { const n=board.nodes.find(n=>n.id===el.dataset.textNode); if(n){n.data.content=el.innerText;saveBoard();} });
    el.addEventListener('mousedown', e=>e.stopPropagation());
  });
  inner.querySelectorAll('.board-node-link').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.dataset.resize) return;
      const n=board.nodes.find(n=>n.id===el.dataset.nodeId);
      if(n?.data?.url) window.open(n.data.url,'_blank');
    });
  });
  inner.querySelectorAll('[data-rift-toggle]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      boardToggleRiftTask(parseInt(btn.dataset.riftToggle));
      btn.classList.toggle('done');
      const t=btn.nextElementSibling; if(t) t.classList.toggle('done');
    });
  });
  inner.querySelectorAll('[data-open-noir]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();launchApp('noir');}));
  inner.querySelectorAll('[data-open-flow]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();launchApp('flow');}));
  inner.querySelectorAll('[data-open-rift]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();launchApp('rift');}));
  inner.querySelectorAll('.board-node').forEach(el => {
    el.addEventListener('mousedown', e => {
      if (e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.contentEditable==='true'||
          e.target.dataset.resize||e.target.closest('[data-resize]')||e.target.dataset.riftToggle||
          e.target.dataset.stickyColor||e.target.dataset.openNoir||e.target.dataset.openFlow||e.target.dataset.openRift) return;
      const nodeId=el.dataset.nodeId, n=board.nodes.find(n=>n.id===nodeId);
      if(!n||n.locked) return;
      boardDrag={nodeId,startMouseX:e.clientX,startMouseY:e.clientY,startNodeX:n.x,startNodeY:n.y};
      n.z=++boardZCounter; el.style.zIndex=n.z; e.preventDefault();
    });
    el.addEventListener('contextmenu', e=>{e.preventDefault();e.stopPropagation();boardShowNodeContextMenu(e,el.dataset.nodeId);});
  });
  inner.querySelectorAll('[data-resize]').forEach(handle => {
    handle.addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault();
      const n=board.nodes.find(n=>n.id===handle.dataset.resize); if(!n) return;
      boardResizeDrag={nodeId:handle.dataset.resize,startMouseX:e.clientX,startMouseY:e.clientY,startW:n.w,startH:n.h||150};
    });
  });
}

function boardAddSpecificNode(opts) {
  const b = boardGetActive();
  const node = { id:nuid(), locked:false, z:++boardZCounter, ...opts };
  b.nodes.push(node); return node;
}

function boardAddNode(type, x, y) {
  const sizes = { sticky:{w:220,h:180}, text:{w:280,h:null}, image:{w:300,h:220}, shape:{w:160,h:160}, link:{w:280,h:90} };
  const d = sizes[type]||{w:200,h:150};
  if (type === 'image') { boardAddImageNode(x, y); return; }
  if (type === 'link') {
    const url = prompt('Enter URL:'); if (!url) return;
    boardAddSpecificNode({ type:'link', x, y, w:280, h:90, data:{ url, title:url } });
  } else if (type === 'shape') {
    const sh = prompt('Shape (rect/circle/triangle/line):', 'rect')||'rect';
    boardAddSpecificNode({ type:'shape', x, y, w:160, h:160, data:{ shape:sh, fill:'rgba(123,92,240,0.2)', stroke:'rgba(123,92,240,0.7)', strokeWidth:1.5, opacity:1 } });
  } else {
    const defaults = { text:{content:'Text',fontSize:14,fontWeight:'400',color:'rgba(255,255,255,0.9)',align:'left'}, sticky:{text:'',color:'yellow'} };
    boardAddSpecificNode({ type, x, y, w:d.w, h:d.h, data:defaults[type]||{} });
  }
  saveBoard(); boardRenderAllNodes(); boardUpdateEmptyState();
}

function boardAddImageNode(x, y) {
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = () => {
    const file=input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload = ev => {
      boardAddSpecificNode({ type:'image', x, y, w:300, h:220, data:{ src:ev.target.result, objectFit:'cover', caption:'', borderRadius:10 }});
      saveBoard(); boardRenderAllNodes(); boardUpdateEmptyState();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function boardShowNodeContextMenu(e, nodeId) {
  const board = boardGetActive();
  const node = board?.nodes.find(n=>n.id===nodeId); if(!node) return;
  const menu = document.getElementById('ctx-menu'); if(!menu) return;
  const items = [
    { label:'Bring to Front', fn:()=>{ node.z=++boardZCounter; const el=document.querySelector(`[data-node-id="${nodeId}"]`); if(el) el.style.zIndex=node.z; saveBoard(); }},
    { label:'Send to Back', fn:()=>{ node.z=0; const el=document.querySelector(`[data-node-id="${nodeId}"]`); if(el) el.style.zIndex=0; saveBoard(); }},
    { label:node.locked?'Unlock':'Lock', fn:()=>{ node.locked=!node.locked; saveBoard(); boardRenderAllNodes(); }},
    { label:'Duplicate', fn:()=>{ const c=JSON.parse(JSON.stringify(node)); c.id=nuid(); c.x+=20; c.y+=20; c.z=++boardZCounter; board.nodes.push(c); saveBoard(); boardRenderAllNodes(); }},
    { label:'Delete', danger:true, fn:()=>{ board.nodes=board.nodes.filter(n=>n.id!==nodeId); saveBoard(); document.querySelector(`[data-node-id="${nodeId}"]`)?.remove(); boardUpdateEmptyState(); }},
    ...(node.type==='image' ? [{ label:'Set as Wallpaper', fn:()=>{ applyCustomMedia(node.data.src); showToast('Wallpaper','Set from BOARD','linear-gradient(145deg,#0a0f1a,#38BDF8)'); }}] : [])
  ];
  menu.innerHTML = items.map((it,i)=>`<div class="ctx-item${it.danger?' danger':''}" data-bi="${i}">${it.label}</div>`).join('');
  menu.querySelectorAll('.ctx-item').forEach((el,i)=>el.addEventListener('click',()=>{items[i].fn();hideCtxMenu();}));
  menu.style.left=e.clientX+'px'; menu.style.top=e.clientY+'px'; menu.classList.add('open');
}

function boardToggleRiftTask(taskId) {
  const task = todoData.items.find(t=>t.id===taskId); if(!task) return;
  task.done=!task.done; saveTodo(); refreshAppIfOpen('rift');
  const board=boardGetActive(), node=board?.nodes.find(n=>n.type==='rift-task'&&n.data.taskId===taskId);
  if(node){node.data.done=task.done;saveBoard();}
  const rw=windows.find(w=>w.appId==='rift');
  if(rw){const b=document.querySelector(`#win-${rw.id} .wnd-body`);if(b)renderTodoApp(b);}
}

function boardImportNoir(type, ids) {
  const board=boardGetActive();
  const existing=board.nodes.filter(n=>n.type===`noir-${type}`);
  const startX=existing.length?Math.max(...existing.map(n=>n.x))+240:50, startY=50;
  ids.forEach((id,i)=>{
    if(type==='idea'){const it=noirData.ideas?.find(x=>x.id===id);if(it)boardAddSpecificNode({type:'noir-idea',x:startX,y:startY+i*130,w:220,h:110,data:{ideaId:it.id,text:it.text,pinned:it.pinned}});}
    else if(type==='hook'){const it=noirData.hooks?.find(x=>x.id===id);if(it)boardAddSpecificNode({type:'sticky',x:startX,y:startY+i*180,w:220,h:160,data:{text:it.text,color:'purple'}});}
    else if(type==='script'){const it=noirData.scripts?.find(x=>x.id===id);if(it)boardAddSpecificNode({type:'text',x:startX,y:startY+i*220,w:320,h:200,data:{content:(it.title||'')+(it.content?'\n\n'+it.content.slice(0,200):''),fontSize:13,fontWeight:'400',color:'rgba(255,255,255,0.85)',align:'left'}});}
  });
  saveBoard(); boardRenderAllNodes();
  showToast('BOARD',`${ids.length} items added`,'linear-gradient(145deg,#0a0f1a,#38BDF8)');
}

function boardImportFlow(cardIds) {
  let i=0;
  cardIds.forEach(cardId=>{
    const result=flowFindCard(cardId); if(!result) return;
    const{col,card}=result;
    boardAddSpecificNode({type:'flow-card',x:60+i*300,y:80,w:280,h:110,data:{cardId:card.id,colId:col.id,title:card.title,tag:card.tag||null,priority:card.priority||null,colName:col.title}});
    i++;
  });
  saveBoard(); boardRenderAllNodes();
  showToast('BOARD',`${cardIds.length} cards added`,'linear-gradient(145deg,#0a1a10,#10B981)');
}

function boardImportRift(taskIds) {
  let i=0;
  taskIds.forEach(taskId=>{
    const task=(todoData?.items||[]).find(t=>t.id===taskId); if(!task) return;
    boardAddSpecificNode({type:'rift-task',x:60+i*280,y:80,w:260,h:80,data:{taskId:task.id,text:task.text,done:task.done,prio:task.prio}});
    i++;
  });
  saveBoard(); boardRenderAllNodes();
  showToast('BOARD',`${taskIds.length} tasks added`,'linear-gradient(145deg,#1a1030,#7B5CF0)');
}

function boardShowImportOverlay(source) {
  const wrap = document.querySelector('.board-wrap'); if(!wrap) return;
  const overlay = document.createElement('div');
  overlay.className = 'board-import-overlay';
  const isNoir=source==='noir', isFlow=source==='flow';
  let currentTab = isNoir?'idea':isFlow?'card':'task';
  const tabsHTML = isNoir
    ? `<button class="board-import-tab active" data-tab="idea">Ideas</button><button class="board-import-tab" data-tab="hook">Hooks</button><button class="board-import-tab" data-tab="script">Scripts</button>`
    : `<button class="board-import-tab active" data-tab="${currentTab}">${isFlow?'Cards':'Tasks'}</button>`;

  function itemsHTML(tab) {
    let items=[];
    if(source==='noir'){
      if(tab==='idea') items=(noirData.ideas||[]);
      else if(tab==='hook') items=(noirData.hooks||[]);
      else items=(noirData.scripts||[]);
    } else if(source==='flow'){
      (flowData.columns||[]).forEach(col=>(col.cards||[]).forEach(c=>items.push({...c,colName:col.title})));
    } else {
      items=(todoData?.items||[]).filter(t=>!t.done);
    }
    if(!items.length) return `<div style="color:var(--t3);font-size:12px;padding:12px">No items found</div>`;
    return items.slice(0,20).map(it=>`<label class="board-import-item"><input type="checkbox" value="${it.id}"/><span>${boardEsc((it.text||it.title||'Untitled').slice(0,60))}${source==='flow'?` <span style="color:var(--t3);font-size:10px">${boardEsc(it.colName||'')}</span>`:''}</span></label>`).join('');
  }

  overlay.innerHTML=`<div class="board-import-card"><div style="font-size:14px;font-weight:600;color:var(--t1);margin-bottom:10px">Import from ${source.toUpperCase()}</div><div class="board-import-tabs">${tabsHTML}</div><div class="board-import-list" id="board-import-list">${itemsHTML(currentTab)}</div><div class="board-import-footer"><button class="board-import-cancel">Cancel</button><button class="board-import-add">Add to Board</button></div></div>`;
  wrap.appendChild(overlay);

  overlay.querySelectorAll('.board-import-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      overlay.querySelectorAll('.board-import-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active'); currentTab=tab.dataset.tab;
      document.getElementById('board-import-list').innerHTML=itemsHTML(currentTab);
    });
  });
  overlay.querySelector('.board-import-cancel').addEventListener('click',()=>overlay.remove());
  overlay.querySelector('.board-import-add').addEventListener('click',()=>{
    const checked=[...overlay.querySelectorAll('input[type=checkbox]:checked')].map(cb=>source==='rift'?parseInt(cb.value):cb.value);
    overlay.remove();
    if(!checked.length) return;
    if(source==='noir') boardImportNoir(currentTab,checked);
    else if(source==='flow') boardImportFlow(checked);
    else boardImportRift(checked);
  });
}

function boardExportPNG() {
  const inner=document.getElementById('board-canvas-inner'); if(!inner) return;
  const prev=inner.style.transform; inner.style.transform='none';
  import('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js')
    .then(m=>(m.default||window.html2canvas)(inner,{backgroundColor:'#08080f',scale:2,useCORS:true}))
    .then(canvas=>{
      inner.style.transform=prev;
      const a=document.createElement('a');
      a.download=`board-${boardGetActive()?.name||'export'}-${Date.now()}.png`;
      a.href=canvas.toDataURL('image/png'); a.click();
      showToast('BOARD','Board exported as PNG','linear-gradient(145deg,#0a0f1a,#38BDF8)');
    })
    .catch(()=>{inner.style.transform=prev;showToast('BOARD','Export failed','linear-gradient(145deg,#991b1b,#ef4444)');});
}

function boardSwitch(id) { boardSaveView(); boardData.activeBoardId=id; saveBoard(); boardFullRender(); }
function boardNew() {
  if(boardData.boards.length>=10){showToast('BOARD','Max 10 boards reached','linear-gradient(145deg,#991b1b,#ef4444)');return;}
  const id=nuid();
  boardData.boards.push({id,name:`Board ${boardData.boards.length+1}`,nodes:[],pan:{x:0,y:0},zoom:1});
  boardData.activeBoardId=id; saveBoard(); boardFullRender();
}
function boardFullRender() {
  const w=windows.find(w=>w.appId==='board'); if(!w) return;
  const body=document.querySelector(`#win-${w.id} .wnd-body`); if(body) renderBoardApp(body);
}

function renderBoardApp(body) {
  loadBoard();
  const b = boardGetActive();
  body.innerHTML=`
  <div class="board-wrap">
